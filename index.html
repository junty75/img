// ─── EXIF 메타 유틸 (piexif) ─────────────────────────
// XPTitle/XPComment 는 UTF-16LE 바이트 배열 (한글 안전 — 탐색기/데스크톱 뷰어와 동일 필드)
function _xpBytes(str) { const a = []; for (const ch of String(str)) { const c = ch.charCodeAt(0); a.push(c & 0xFF, (c >> 8) & 0xFF); } a.push(0, 0); return a; }
function _xpStr(bytes) { if (!bytes || !bytes.length) return ''; let s = ''; for (let i = 0; i + 1 < bytes.length; i += 2) { const c = bytes[i] | (bytes[i+1] << 8); if (!c) break; s += String.fromCharCode(c); } return s; }
function _gpsRat(v) { v = Math.abs(v); const d = Math.floor(v), mF = (v - d) * 60, m = Math.floor(mF), s = Math.round((mF - m) * 60 * 10000); return [[d,1],[m,1],[s,10000]]; }
function exifNow(d = new Date()) { const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}:${p(d.getMonth()+1)}:${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function _escXml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// piexif.dump() 출력의 TIFF 사양 위반을 표준 구조로 재조립:
//  - IFD 엔트리 태그 오름차순 정렬 (piexif 는 Exif/GPS 포인터를 맨 뒤에 붙여 미정렬 —
//    안드로이드 등 엄격한 파서는 정렬을 가정해 GPS 포인터를 못 찾을 수 있음)
//  - 모든 IFD 뒤에 next-IFD 오프셋 기록 (piexif 는 서브 IFD 종결자 누락 → 뒤 4바이트가
//    쓰레기 오프셋으로 읽혀 체인 파서가 EXIF 전체를 버림) — 폰 갤러리 위치 미인식의 원인
// 실패 시 원본 그대로 반환 (안전).
function _fixExif(exifStr) {
  try {
    if (exifStr.slice(0, 6) !== 'Exif\x00\x00') return exifStr;
    const t = exifStr.slice(6);
    const le = t.slice(0, 2) === 'II';
    if (!le && t.slice(0, 2) !== 'MM') return exifStr;
    const b = o => t.charCodeAt(o) & 0xFF;
    const u16 = o => le ? b(o) | (b(o+1) << 8) : (b(o) << 8) | b(o+1);
    const u32 = o => le ? (u16(o) | (u16(o+2) * 0x10000)) : (u16(o) * 0x10000 + u16(o+2));
    const SZ = { 1:1, 2:1, 3:2, 4:4, 5:8, 6:1, 7:1, 8:2, 9:4, 10:8, 11:4, 12:8 };
    const valU32 = s => { const c = i => s.charCodeAt(i) & 0xFF; return le ? c(0) + c(1)*0x100 + c(2)*0x10000 + c(3)*0x1000000 : c(0)*0x1000000 + c(1)*0x10000 + c(2)*0x100 + c(3); };

    function readIFD(off) {
      if (off <= 0 || off + 2 > t.length) return null;
      const n = u16(off), entries = [];
      if (off + 2 + 12*n > t.length) return null;
      for (let k = 0; k < n; k++) {
        const p = off + 2 + 12*k, tag = u16(p), typ = u16(p+2), cnt = u32(p+4);
        if (!SZ[typ]) continue;
        const size = SZ[typ] * cnt;
        let val;
        if (size <= 4) val = t.slice(p+8, p+12);
        else { const vo = u32(p+8); if (vo + size > t.length) continue; val = t.slice(vo, vo + size); }
        entries.push({ tag, typ, cnt, val });
      }
      const nx = off + 2 + 12*n + 4 <= t.length ? u32(off + 2 + 12*n) : 0;
      return { entries, next: nx };
    }
    const take = (list, tag) => { const i = list.findIndex(e => e.tag === tag); return i < 0 ? null : list.splice(i, 1)[0]; };

    const ifd0 = readIFD(u32(4));
    if (!ifd0) return exifStr;
    const pExif = take(ifd0.entries, 0x8769), pGPS = take(ifd0.entries, 0x8825);
    const exifIFD = pExif ? readIFD(valU32(pExif.val)) : null;
    let interopIFD = null;
    if (exifIFD) { const pI = take(exifIFD.entries, 0xA005); interopIFD = pI ? readIFD(valU32(pI.val)) : null; }
    const gpsIFD = pGPS ? readIFD(valU32(pGPS.val)) : null;
    let ifd1 = ifd0.next ? readIFD(ifd0.next) : null, thumb = '';
    if (ifd1) {
      const pT = take(ifd1.entries, 0x0201), pL = take(ifd1.entries, 0x0202);
      if (pT && pL) {
        const to = valU32(pT.val), tl = valU32(pL.val);
        if (to + tl <= t.length) thumb = t.slice(to, to + tl);
      }
      if (!thumb) ifd1 = null;   // 썸네일 없는 IFD1 은 버림
    }

    // ── 재조립 ──
    const chr = String.fromCharCode;
    const p16 = v => le ? chr(v & 255) + chr((v >> 8) & 255) : chr((v >> 8) & 255) + chr(v & 255);
    const p32 = v => le ? p16(v & 0xFFFF) + p16((v / 0x10000) & 0xFFFF) : p16((v / 0x10000) & 0xFFFF) + p16(v & 0xFFFF);
    function prep(ifd) {   // 정렬 + 중복 제거 + 크기 계산
      const seen = {};
      ifd.entries = ifd.entries.filter(e => seen[e.tag] ? false : (seen[e.tag] = 1)).sort((a, b) => a.tag - b.tag);
      ifd.valSize = ifd.entries.reduce((s, e) => s + (e.val.length > 4 ? e.val.length + (e.val.length & 1) : 0), 0);
      ifd.tblSize = 2 + 12 * ifd.entries.length + 4;
      return ifd;
    }
    function serIFD(ifd, tblOff, next) {
      let vo = tblOff + ifd.tblSize, tbl = p16(ifd.entries.length), vals = '';
      for (const e of ifd.entries) {
        tbl += p16(e.tag) + p16(e.typ) + p32(e.cnt);
        if (e.val.length <= 4) tbl += (e.val + '\x00\x00\x00\x00').slice(0, 4);
        else { tbl += p32(vo); vals += e.val + (e.val.length & 1 ? '\x00' : ''); vo += e.val.length + (e.val.length & 1); }
      }
      return tbl + p32(next) + vals;
    }

    const mkPtr = tag => ({ tag, typ: 4, cnt: 1, val: '\x00\x00\x00\x00' });
    if (exifIFD) ifd0.entries.push(mkPtr(0x8769));
    if (gpsIFD) ifd0.entries.push(mkPtr(0x8825));
    if (exifIFD && interopIFD) exifIFD.entries.push(mkPtr(0xA005));
    if (ifd1) { ifd1.entries.push(mkPtr(0x0201)); ifd1.entries.push({ tag: 0x0202, typ: 4, cnt: 1, val: p32(thumb.length) }); }

    [ifd0, exifIFD, interopIFD, gpsIFD, ifd1].forEach(f => f && prep(f));

    // 순차 배치: IFD0 → Exif → Interop → GPS → IFD1 → 썸네일
    let cur = 8 + ifd0.tblSize + ifd0.valSize;
    const at = {};
    if (exifIFD) { at.exif = cur; cur += exifIFD.tblSize + exifIFD.valSize; }
    if (interopIFD) { at.interop = cur; cur += interopIFD.tblSize + interopIFD.valSize; }
    if (gpsIFD) { at.gps = cur; cur += gpsIFD.tblSize + gpsIFD.valSize; }
    if (ifd1) { at.ifd1 = cur; cur += ifd1.tblSize + ifd1.valSize; at.thumb = cur; }

    const setPtr = (ifd, tag, v) => { const e = ifd.entries.find(x => x.tag === tag); if (e) e.val = p32(v); };
    setPtr(ifd0, 0x8769, at.exif || 0); setPtr(ifd0, 0x8825, at.gps || 0);
    if (exifIFD) setPtr(exifIFD, 0xA005, at.interop || 0);
    if (ifd1) setPtr(ifd1, 0x0201, at.thumb || 0);

    let out = (le ? 'II' : 'MM') + p16(42) + p32(8);
    out += serIFD(ifd0, 8, at.ifd1 || 0);
    if (exifIFD) out += serIFD(exifIFD, at.exif, 0);
    if (interopIFD) out += serIFD(interopIFD, at.interop, 0);
    if (gpsIFD) out += serIFD(gpsIFD, at.gps, 0);
    if (ifd1) out += serIFD(ifd1, at.ifd1, 0) + thumb;
    return 'Exif\x00\x00' + out;
  } catch (e) { console.warn('EXIF 정규화 실패', e); return exifStr; }
}

// EXIF 를 통째로 재직렬화(dump)하다 실패하면(일부 폰 MakerNote 등)
// 핵심 필드(날짜·GPS·제목·설명)만이라도 옮겨서 기록한다 — 실패 시 메타가 통째로 사라지던 문제 방지.
function _exifSafeCarry(exif, jpegDataUrl) {
  try { return piexif.insert(_fixExif(piexif.dump(exif)), jpegDataUrl); }
  catch(e) {
    try {
      const fresh = { '0th':{}, 'Exif':{}, 'GPS':{}, '1st':{}, 'thumbnail':null };
      const o = exif['0th'] || {}, x = exif['Exif'] || {}, g = exif['GPS'] || {};
      const dt = x[piexif.ExifIFD.DateTimeOriginal] || o[piexif.ImageIFD.DateTime];
      if (dt) { fresh['Exif'][piexif.ExifIFD.DateTimeOriginal] = dt; fresh['0th'][piexif.ImageIFD.DateTime] = dt; }
      if (g[piexif.GPSIFD.GPSLatitude]) {
        fresh['GPS'][piexif.GPSIFD.GPSVersionID]    = g[piexif.GPSIFD.GPSVersionID]    || [2, 3, 0, 0];
        fresh['GPS'][piexif.GPSIFD.GPSLatitudeRef]  = g[piexif.GPSIFD.GPSLatitudeRef]  || 'N';
        fresh['GPS'][piexif.GPSIFD.GPSLatitude]     = g[piexif.GPSIFD.GPSLatitude];
        fresh['GPS'][piexif.GPSIFD.GPSLongitudeRef] = g[piexif.GPSIFD.GPSLongitudeRef] || 'E';
        fresh['GPS'][piexif.GPSIFD.GPSLongitude]    = g[piexif.GPSIFD.GPSLongitude];
      }
      if (o[piexif.ImageIFD.XPTitle])   fresh['0th'][piexif.ImageIFD.XPTitle]   = o[piexif.ImageIFD.XPTitle];
      if (o[piexif.ImageIFD.XPComment]) fresh['0th'][piexif.ImageIFD.XPComment] = o[piexif.ImageIFD.XPComment];
      if (o[piexif.ImageIFD.ImageDescription]) fresh['0th'][piexif.ImageIFD.ImageDescription] = o[piexif.ImageIFD.ImageDescription];
      return piexif.insert(_fixExif(piexif.dump(fresh)), jpegDataUrl);
    } catch(e2) { console.warn('EXIF 기록 실패', e2); return jpegDataUrl; }
  }
}

// 사진 dataURL 에서 제목/설명/촬영일시/GPS 읽기
function readPhotoMeta(imgSrc) {
  const out = { title:'', desc:'', taken:'', lat:null, lng:null };
  try {
    const ex = piexif.load(imgSrc);
    out.title = _xpStr(ex['0th'][piexif.ImageIFD.XPTitle]);
    out.desc  = _xpStr(ex['0th'][piexif.ImageIFD.XPComment]);
    out.taken = (ex['Exif'] && ex['Exif'][piexif.ExifIFD.DateTimeOriginal]) || ex['0th'][piexif.ImageIFD.DateTime] || '';
    const gps = ex['GPS'];
    if (gps && gps[piexif.GPSIFD.GPSLatitude] && gps[piexif.GPSIFD.GPSLongitude]) {
      const toDec = (dms, ref) => { const d = dms[0][0]/dms[0][1], m = dms[1][0]/dms[1][1], s = dms[2][0]/dms[2][1]; return (d + m/60 + s/3600) * ((ref === 'S' || ref === 'W') ? -1 : 1); };
      const la = toDec(gps[piexif.GPSIFD.GPSLatitude],  gps[piexif.GPSIFD.GPSLatitudeRef]  || 'N');
      const lo = toDec(gps[piexif.GPSIFD.GPSLongitude], gps[piexif.GPSIFD.GPSLongitudeRef] || 'E');
      if (!isNaN(la) && !isNaN(lo) && (la !== 0 || lo !== 0)) { out.lat = la; out.lng = lo; }
    }
  } catch(e) {}
  return out;
}

// ─── EXIF 읽기 폴백 (exifr) ──────────────────────────
// piexif 는 JPEG 의 APP1 을 자체 파서로 훑기 때문에, 아래 경우 GPS 를 통째로 놓친다.
// 다른 사진앱들은 잘 읽는데 이 뷰어만 못 읽던 원인:
//   · 삼성/아이폰의 큰 MakerNote·다중 APP1 → piexif.load 가 예외 → catch(e){} 로 조용히 삼켜짐
//   · HEIC/HEIF (아이폰 기본), PNG, WebP → piexif 는 JPEG 전용이라 아예 못 읽음
//   · 위치가 EXIF 가 아니라 XMP 에 들어 있는 사진
// exifr 은 원본 File/Blob 을 청크 단위로 직접 읽어 위 경우를 모두 처리한다.
// (스크립트는 예전부터 로드돼 있었지만 실제로 호출하는 곳이 없었다 — 2026-08-11 연결)
async function readPhotoMetaFallback(file) {
  const out = { taken:'', lat:null, lng:null, diag:'' };
  if (!file) { out.diag = '파일 없음'; return out; }
  if (!window.exifr) { out.diag = 'exifr 미로드 — CDN 차단/오프라인'; return out; }
  let ex = null;
  try {
    try { ex = await exifr.parse(file, { tiff:true, ifd0:true, exif:true, gps:true, xmp:true }); } catch(e) {}
    let la = ex && ex.latitude, lo = ex && ex.longitude;
    if (la == null || lo == null) {                       // gps() 는 더 관대한 경로 — 한 번 더 시도
      try { const g = await exifr.gps(file); if (g) { la = g.latitude; lo = g.longitude; } } catch(e) {}
    }
    if (typeof la === 'number' && typeof lo === 'number' &&
        !isNaN(la) && !isNaN(lo) && (la !== 0 || lo !== 0)) { out.lat = la; out.lng = lo; }
    const d = ex && (ex.DateTimeOriginal || ex.CreateDate || ex.ModifyDate);
    if (d instanceof Date && !isNaN(d)) out.taken = exifNow(d);
    else if (typeof d === 'string') out.taken = d;
  } catch(e) { console.warn('exifr 폴백 실패', e); }
  out.diag = out.lat != null ? 'GPS 읽음'
    : (!ex || Object.keys(ex).length === 0)
      ? 'EXIF 자체가 없음 — 사진이 재저장(스크린샷·메신저 경유 등)된 파일'
      : 'EXIF 는 있는데 GPS 만 없음 — 안드로이드 갤러리 선택창이 위치를 지운 것.\n사진 고를 때 갤러리 말고 "파일" 앱으로 선택하세요.';
  return out;
}

// GPS/촬영일시 등을 JPEG dataURL 의 EXIF 에 기록 (전달 안 한 항목은 유지)
function writePhotoMeta(imgSrc, { title, desc, lat, lng, taken } = {}) {
  try {
    let ex; try { ex = piexif.load(imgSrc); } catch(e) { ex = { '0th':{}, 'Exif':{}, 'GPS':{}, '1st':{}, 'thumbnail':null }; }
    ex['0th'] = ex['0th'] || {}; ex['Exif'] = ex['Exif'] || {}; ex['GPS'] = ex['GPS'] || {};
    if (title != null) {
      ex['0th'][piexif.ImageIFD.XPTitle] = _xpBytes(title);
      // ImageDescription 은 ASCII 필드 — 한글이면 기록 안 함 (외부 뷰어 인코딩 깨짐 방지)
      if (/^[\x00-\x7F]*$/.test(title)) ex['0th'][piexif.ImageIFD.ImageDescription] = title;
      else delete ex['0th'][piexif.ImageIFD.ImageDescription];
    }
    if (desc != null) ex['0th'][piexif.ImageIFD.XPComment] = _xpBytes(desc);
    if (taken) { ex['Exif'][piexif.ExifIFD.DateTimeOriginal] = taken; ex['0th'][piexif.ImageIFD.DateTime] = taken; }
    // 카메라 파일과 유사하게 기본 태그 보강 (없을 때만)
    ex['0th'][piexif.ImageIFD.Orientation] = ex['0th'][piexif.ImageIFD.Orientation] || 1;
    ex['Exif'][piexif.ExifIFD.ExifVersion] = ex['Exif'][piexif.ExifIFD.ExifVersion] || '0231';
    if (lat != null && lng != null) {
      // 카메라 앱과 동일한 GPS 블록 구성 (VersionID·고도·날짜/시간스탬프 포함)
      ex['GPS'][piexif.GPSIFD.GPSVersionID]    = ex['GPS'][piexif.GPSIFD.GPSVersionID] || [2, 3, 0, 0];
      ex['GPS'][piexif.GPSIFD.GPSLatitudeRef]  = lat >= 0 ? 'N' : 'S';
      ex['GPS'][piexif.GPSIFD.GPSLatitude]     = _gpsRat(lat);
      ex['GPS'][piexif.GPSIFD.GPSLongitudeRef] = lng >= 0 ? 'E' : 'W';
      ex['GPS'][piexif.GPSIFD.GPSLongitude]    = _gpsRat(lng);
      ex['GPS'][piexif.GPSIFD.GPSAltitudeRef]  = ex['GPS'][piexif.GPSIFD.GPSAltitudeRef] || 0;
      ex['GPS'][piexif.GPSIFD.GPSAltitude]     = ex['GPS'][piexif.GPSIFD.GPSAltitude] || [0, 1];
      const _ts = taken || ex['Exif'][piexif.ExifIFD.DateTimeOriginal] || exifNow();
      const _md = String(_ts).match(/^(\d{4}:\d{2}:\d{2}) (\d{2}):(\d{2}):(\d{2})/);
      if (_md && !ex['GPS'][piexif.GPSIFD.GPSDateStamp]) {
        ex['GPS'][piexif.GPSIFD.GPSDateStamp] = _md[1];
        ex['GPS'][piexif.GPSIFD.GPSTimeStamp] = [[+_md[2], 1], [+_md[3], 1], [+_md[4], 1]];
      }
    }
    return _exifSafeCarry(ex, imgSrc);
  } catch(e) { console.warn('EXIF 기록 실패', e); return imgSrc; }
}
// JFIF(APP0) 세그먼트 제거 — 카메라 파일과 동일한 'SOI + APP1' 구조로 정리
function _stripApp0(u8) {
  try {
    if (u8[0] !== 0xFF || u8[1] !== 0xD8) return u8;
    let i = 2, app0 = null, hasExif = false;
    while (i + 3 < u8.length && u8[i] === 0xFF) {
      const m = u8[i + 1];
      if (m === 0xDA) break;
      const len = (u8[i + 2] << 8) | u8[i + 3];
      if (m === 0xE0) app0 = [i, i + 2 + len];
      if (m === 0xE1 && u8[i + 4] === 0x45 && u8[i + 5] === 0x78) hasExif = true;   // 'Ex'if
      i += 2 + len;
    }
    if (app0 && hasExif) {
      const o = new Uint8Array(u8.length - (app0[1] - app0[0]));
      o.set(u8.subarray(0, app0[0]), 0);
      o.set(u8.subarray(app0[1]), app0[0]);
      return o;
    }
  } catch(e) {}
  return u8;
}
// 사진을 기기에 저장 (안드로이드: 다운로드 폴더 → 갤러리에 표시됨)
// data: URL 은 용량이 크면 안드로이드 크롬에서 다운로드가 '조용히' 실패 → Blob 으로 변환해 저장.
// 바이트 변환은 fetch(dataURL) 네이티브 경로 사용 — 수백만 회 charCodeAt 루프가
// 메인 스레드를 1~2초 막아 지도가 하얗게 멈추던 원인이었음.
async function downloadPhoto(imgSrc, name) {
  const nm0 = (name || 'photo').replace(/[\\/:*?"<>|]/g, '_');
  const nm = /\.jpe?g$/i.test(nm0) ? nm0 : nm0 + '.jpg';
  let href = imgSrc, revoke = null;
  try {
    const blob = await (await fetch(imgSrc)).blob();
    const mime = blob.type || 'image/jpeg';
    let u8 = new Uint8Array(await blob.arrayBuffer());
    if (/jpe?g$/i.test(mime)) u8 = _stripApp0(u8);
    href = URL.createObjectURL(new Blob([u8], { type: mime }));
    revoke = href;
  } catch(e) {}
  const a = document.createElement('a');
  a.href = href; a.download = nm;
  document.body.appendChild(a); a.click(); a.remove();
  if (revoke) setTimeout(() => URL.revokeObjectURL(revoke), 10000);
}

// ─── 이미지 파일을 사진 마커로 추가 (EXIF GPS 우선) ──
// index_20260611 의 단순 경로(EXIF GPS 만 읽고 마커 추가) + 메모리 절약용 압축 표시본.
// 촬영 판정·현재위치 조회·EXIF 기록·기기 저장은 하지 않는다 (지도 백화 유발 이력).
async function loadImageAsMarker(imgFile) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const imgSrc = ev.target.result;
      const name = imgFile.name.replace(/\.[^.]+$/, '');

      // EXIF GPS 읽기 (exif0 은 압축본 EXIF 복사에 재사용)
      let latlng = null, exif0 = null;
      try {
        const exif = exif0 = piexif.load(imgSrc);
        const gps = exif['GPS'];
        if (gps && gps[piexif.GPSIFD.GPSLatitude] && gps[piexif.GPSIFD.GPSLongitude]) {
          const toDec = (dms, ref) => {
            const d = dms[0][0]/dms[0][1];
            const m = dms[1][0]/dms[1][1];
            const s = dms[2][0]/dms[2][1];
            return (d + m/60 + s/3600) * ((ref === 'S' || ref === 'W') ? -1 : 1);
          };
          const lat = toDec(gps[piexif.GPSIFD.GPSLatitude],  gps[piexif.GPSIFD.GPSLatitudeRef]  || 'N');
          const lng = toDec(gps[piexif.GPSIFD.GPSLongitude], gps[piexif.GPSIFD.GPSLongitudeRef] || 'E');
          if (!isNaN(lat) && !isNaN(lng) && (lat !== 0 || lng !== 0)) {
            latlng = new kakao.maps.LatLng(lat, lng);
          }
        }
      } catch(e) {}

      // piexif 가 GPS 를 못 읽었으면 exifr 로 원본 파일을 다시 읽는다
      // (HEIC·삼성 MakerNote·XMP 위치 등 — readPhotoMetaFallback 주석 참조)
      let fb = null;
      if (!latlng) {
        fb = await readPhotoMetaFallback(imgFile);
        if (fb.lat != null) latlng = new kakao.maps.LatLng(fb.lat, fb.lng);
        else _noGpsDiag = fb.diag;
        console.log('[EXIF]', imgFile.name, fb.diag);
      }

      // 대량 사진 대비 메모리 절약: 마커에는 압축 표시본만 사용.
      // 압축은 워커(OffscreenCanvas)에서 — 페이지 캔버스 압축은 지도 백화 유발.
      // 워커 미지원/실패 시 원본 그대로 사용 (백화 없던 옛 동작).
      let dispSrc = imgSrc;
      const compressed = await compressFileInWorker(imgFile);
      if (compressed) {
        dispSrc = compressed;
        // GPS·촬영일시 EXIF 를 압축본에 복사 (KMZ 저장 시 위치·날짜 유지)
        try {
          if (exif0) {
            if (exif0['0th']) {
              delete exif0['0th'][piexif.ImageIFD.UserComment];
              delete exif0['0th'][piexif.ImageIFD.ImageDescription];
              exif0['0th'][piexif.ImageIFD.Orientation] = 1;   // 워커 압축본은 픽셀에 회전 반영됨
            }
            if (exif0['Exif']) delete exif0['Exif'][piexif.ExifIFD.UserComment];
            dispSrc = _exifSafeCarry(exif0, compressed);
          } else if (fb && fb.lat != null) {
            // piexif 로는 원본 EXIF 를 못 열었지만 exifr 이 위치를 찾은 경우 —
            // 압축본(JPEG)에 위치·촬영일시를 새로 써 넣어야 저장 파일에도 위치가 남는다
            dispSrc = writePhotoMeta(compressed, { lat: fb.lat, lng: fb.lng, taken: fb.taken || undefined });
          }
        } catch(e) { dispSrc = compressed; }
      }

      if (latlng) {
        addPhotoMarker(latlng, dispSrc, name);
        map.panTo(latlng);
      } else {
        addPhotoMarker(map.getCenter(), dispSrc, name);
      }
      document.getElementById('saveBtn').disabled = false;
      autoSaveToDB();
      resolve();
    };
    reader.readAsDataURL(imgFile);
  });
}

      '<h3 style="margin:0 0 14px;font-size:15px;color:#333;text-align:center;">저장 범위 선택</h3>' +

      `<button data-scope="all" style="${btnCss}background:#00897b;color:white;">🌍 전체영역<br><span style="font-size:11px;font-weight:400;">모든 객체</span></button>` +
      `<button data-scope="" style="${btnCss}background:#f1f3f4;color:#555;margin-bottom:0;">취소</button>` +
      '</div>';

      const b = e.target.closest('button');

      bg.remove();
      resolve(b ? (b.dataset.scope || null) : null);
    });
    document.body.appendChild(bg);
  });

  const bounds = scope === 'view' ? map.getBounds() : null;
  const R = n => +Number(n).toFixed(7);
  const D = { LINES: [], POLYS: [], TEXTS: [], MARKERS: [], PHOTOS: [] };

  // 뷰포트 컬링으로 지도에서 뗀 선(_viewCulled)도 데이터는 살아있음 — 저장 포함
  for (const pl of polylines) {
    if (!pl.poly.getMap() && !pl.poly._viewCulled) continue;
    const parts = (pl.parts && pl.parts.length) ? pl.parts : [pl.path];
    if (bounds && !parts.some(cs => cs.some(p => bounds.contain(p)))) continue;
    const p = parts.map(cs => cs.map(ll => [R(ll.getLat()), R(ll.getLng())]))
                   .filter(cs => cs.length >= 2);
    if (p.length) D.LINES.push({ c: pl.color || '#ff0000', o: 1, w: pl.width || 3, p });
  }
  for (const t of textLabels) {
    if (!t.ov.getMap()) continue;
    if (bounds && !bounds.contain(t.pos)) continue;
    D.TEXTS.push([R(t.pos.getLat()), R(t.pos.getLng()), t.name || '', t.rot || 0,
                  t.color || '#FFEB00', t.h || 0, t.ax || 0, t.ay || 0]);
  }
  const photoMarkers = [];
  for (const m of markers) {
    if (!m.marker.getMap()) continue;
    const pos = m.marker.getPosition();
    if (bounds && !bounds.contain(pos)) continue;
    if (m.imgSrc) photoMarkers.push([m, pos]);
    else D.MARKERS.push([R(pos.getLat()), R(pos.getLng()), m.name || '']);
  }
  for (let i = 0; i < photoMarkers.length; i++) {
    const [m, pos] = photoMarkers[i];
    showLoading('사진 압축 중... (' + (i + 1) + ' / ' + photoMarkers.length + ')');
    let src = '';
    try { src = await compressImage(m.imgSrc); } catch (e) { src = m.imgSrc; }
    D.PHOTOS.push([R(pos.getLat()), R(pos.getLng()), m.name || '', src]);
  }
  return D;
}

// 저장한 파일을 공유 시트로 보낸다 (공유앱 선택). 지원 안 하면 조용히 넘어감.
async function shareHtmFile(file, name) {
  if (!(navigator.canShare && navigator.share)) return;
  let shareable = false;
  try { shareable = navigator.canShare({ files: [file] }); } catch (e) { shareable = false; }
  if (!shareable) return;
  // 사진 압축·파일명 입력을 거치면서 '사용자 조작 유효시간'이 끝났을 수 있다 →
  // 바로 시도해 보고 막히면 버튼 한 번 더 누르게 한다.
  try {
    await navigator.share({ files: [file], title: name, text: name });
    return;
  } catch (e) {
    if (e && e.name === 'AbortError') return;   // 사용자가 공유 취소
  }
  const bg = document.createElement('div');
  bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9200;display:flex;align-items:center;justify-content:center;';
  bg.innerHTML =
    '<div style="background:white;border-radius:14px;padding:20px;width:270px;box-shadow:0 4px 24px rgba(0,0,0,0.25);text-align:center;">' +
    '<h3 style="margin:0 0 6px;font-size:15px;color:#333;">저장 완료</h3>' +
    '<p style="margin:0 0 14px;font-size:12px;color:#777;word-break:break-all;">' + _hescM(name) + '</p>' +
    '<button class="sh-go" style="display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;background:#1a73e8;color:white;">📤 공유하기</button>' +
    '<button class="sh-no" style="display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:#f1f3f4;color:#555;">닫기</button>' +
    '</div>';
  bg.querySelector('.sh-no').onclick = () => bg.remove();
  bg.querySelector('.sh-go').onclick = async () => {
    bg.remove();
    try { await navigator.share({ files: [file], title: name, text: name }); } catch (e) {}
  };
  document.body.appendChild(bg);
}

async function exportHTM(scope = 'all') {
  // 저장 범위: 'view'=현재 화면에 보이는 객체만, 'all'=전체 객체
  const hasAny = markers.some(m => m.marker.getMap())
              || polylines.some(p => p.poly.getMap() || p.poly._viewCulled)
              || textLabels.some(t => t.ov.getMap());
  if (!hasAny) { alert('저장할 객체가 없습니다.'); return; }

  const now = new Date();
  const dateStr = now.getFullYear().toString() +
                  (now.getMonth() + 1).toString().padStart(2, '0') +
                  now.getDate().toString().padStart(2, '0');

  // 지도 중심 좌표로 주소 조회 → 읍면+리 이름 추출
  const getAddrPrefix = () => new Promise(resolve => {
    const center = map.getCenter();
    geocoder.coord2Address(center.getLng(), center.getLat(), (result, status) => {
      if (status !== kakao.maps.services.Status.OK || !result[0]) { resolve(''); return; }
      const parts = (result[0].address?.address_name || '').split(' ').filter(p => !/^\d/.test(p));
      const eupMyeon = parts.find(p => /[읍면]$/.test(p)) || '';
      const ri       = parts.find(p => /리$/.test(p)) || '';
      const gu   = parts.find(p => /구$/.test(p)) || '';
      const dong = [...parts].reverse().find(p => /동(\d+가)?$/.test(p)) || '';
      let prefix = '';
      if (eupMyeon && ri)      prefix = `${eupMyeon.replace(/[읍면]$/, '')}${ri}_`;
      else if (eupMyeon)       prefix = `${eupMyeon}_`;
      else if (gu && dong)     prefix = `${gu.replace(/구$/, '')}${dong}_`;
      else if (gu)             prefix = `${gu.replace(/구$/, '')}_`;
      else if (dong)           prefix = `${dong}_`;
      resolve(prefix);
    });
  });
  const prefix = await getAddrPrefix();

  const activeM = markers.filter(m => m.marker.getMap());
  const lastMarkerRaw = ([...activeM].reverse().find(m => !m.imgSrc)?.name
                        || activeM.at(-1)?.name || '');
  const lastMarkerName = lastMarkerRaw.replace(/_\d{8}.*$/, '').replace(/[\\/:*?"<>|]/g, '').trim();
  const defaultName = lastMarkerName ? `${prefix}${dateStr}_${lastMarkerName}` : `${prefix}${dateStr}_지도`;

  const userInput = prompt('저장할 파일 이름을 입력하세요 (확장자 제외):', defaultName);
  if (userInput === null) return;
  const base = (userInput.trim() || defaultName).replace(/[\\/:*?"<>|]/g, '_');
  const fileName = base + '.htm';

  showLoading('HTM 저장 중...');
  try {
    const D = await _collectHtmData(scope);
    const n = D.LINES.length + D.POLYS.length + D.TEXTS.length + D.MARKERS.length + D.PHOTOS.length;
    if (!n) {
      hideLoading();
      alert(scope === 'view' ? '현재 화면에 보이는 객체가 없습니다.' : '저장할 객체가 없습니다.');
      return;
    }
    const html = buildLauncherHtm(base, D);
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });

    // 1) 저장 (다운로드)
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    if (isIOS) window.open(url, '_blank'); else a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    hideLoading();

    // 2) 공유 시트 (공유앱 선택)
    let f = null;
    try { f = new File([blob], fileName, { type: 'text/html' }); } catch (e) {}
    if (f) await shareHtmFile(f, fileName);
  } catch (err) {
    hideLoading();
    alert('HTM 저장 중 오류: ' + err.message);
  }
}

async function exportKMZ(scope = 'all') {
  // 저장 범위: 'view'=현재 화면에 보이는 객체만, 'all'=전체 객체
  const bounds = scope === 'view' ? map.getBounds() : null;
  const expMarkers = markers.filter(m =>
    m.marker.getMap() && (!bounds || bounds.contain(m.marker.getPosition())));
  // 뷰포트 컬링으로 지도에서 뗀 선(_viewCulled)도 데이터는 살아있음 — 저장 포함
  const expPolylines = polylines.filter(pl =>
    (pl.poly.getMap() || pl.poly._viewCulled) && (!bounds || pl.path.some(p => bounds.contain(p))));
  const expLabels = textLabels.filter(t => !bounds || bounds.contain(t.pos));
  if (expMarkers.length === 0 && expPolylines.length === 0 && expLabels.length === 0) {
    alert(scope === 'view' ? '현재 화면에 보이는 객체가 없습니다.' : '저장할 객체가 없습니다.');
    return;
  }

  // 1. 현재 날짜 문자열
  const now = new Date();
  const dateStr = now.getFullYear().toString() +
                  (now.getMonth() + 1).toString().padStart(2, '0') +
                  now.getDate().toString().padStart(2, '0');

  // 2. 지도 중심 좌표로 주소 조회 → 읍면+리 이름 추출
  const getAddrPrefix = () => new Promise(resolve => {
    const center = map.getCenter();
    geocoder.coord2Address(center.getLng(), center.getLat(), (result, status) => {
      if (status !== kakao.maps.services.Status.OK || !result[0]) { resolve(''); return; }
      const parts = (result[0].address?.address_name || '').split(' ').filter(p => !/^\d/.test(p));
      // 읍·면이 있으면: 읍면명(접미사제거) + 리명(접미사포함)
      const eupMyeon = parts.find(p => /[읍면]$/.test(p)) || '';
      const ri       = parts.find(p => /리$/.test(p)) || '';
      // 구가 있으면: 구명(접미사제거) + 동명(접미사포함, 가번지 포함)
      const gu   = parts.find(p => /구$/.test(p)) || '';
      const dong = [...parts].reverse().find(p => /동(\d+가)?$/.test(p)) || '';

      let prefix = '';
      if (eupMyeon && ri) {
        prefix = `${eupMyeon.replace(/[읍면]$/, '')}${ri}_`;
      } else if (eupMyeon) {
        prefix = `${eupMyeon}_`;
      } else if (gu && dong) {
        prefix = `${gu.replace(/구$/, '')}${dong}_`;
      } else if (gu) {
        prefix = `${gu.replace(/구$/, '')}_`;
      } else if (dong) {
        prefix = `${dong}_`;
      }
      resolve(prefix);
    });
  });

  const prefix = await getAddrPrefix();

  const activeM = expMarkers;
  const lastMarkerRaw = ([...activeM].reverse().find(m => !m.imgSrc)?.name
                        || activeM.at(-1)?.name || '');
  const lastMarkerName = lastMarkerRaw.replace(/_\d{8}.*$/, '').replace(/[\\/:*?"<>|]/g, '').trim();

  const defaultName = lastMarkerName
    ? `${prefix}${dateStr}_${lastMarkerName}`
    : `${prefix}${dateStr}_`;

  // 3. 사용자 파일명 입력
  const userInput = prompt("저장할 파일 이름을 입력하세요 (확장자 제외):", defaultName);
  if (userInput === null) return;
  const fileName = (userInput.trim() || defaultName) + ".kmz";

  showLoading('KMZ 저장 중...');
  try {
    const zip = new JSZip();
    const filesFolder = zip.folder('files');
    let placemarkXml = '';
    let photoIndex = 0;

    for (const m of expMarkers) {
      const pos = m.marker.getPosition();
      const lat = pos.getLat(), lng = pos.getLng();
      const safeName = (m.name || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      if (m.imgSrc) {
        const compressed = await compressImage(m.imgSrc);
        const base64Data = compressed.split(',')[1];
        const filename = `photo_${String(photoIndex++).padStart(4,'0')}.jpg`;
        filesFolder.file(filename, base64Data, { base64: true });
        placemarkXml += `\n  <Placemark>\n    <name>${safeName}</name>\n    <ExtendedData><Data name="photoFile"><value>${filename}</value></Data>${_photoMetaXml(m)}</ExtendedData>\n    <Point><coordinates>${lng},${lat},0</coordinates></Point>\n  </Placemark>`;
      } else {
        placemarkXml += `\n  <Placemark>\n    <name>${safeName}</name>\n    <Point><coordinates>${lng},${lat},0</coordinates></Point>\n  </Placemark>`;
      }
    }
    const styles = new Map();
    for (const pl of expPolylines) placemarkXml += _lineKmlPlacemark(pl, styles);
    for (const t of expLabels) placemarkXml += _textKmlPlacemark(t);

    zip.file('doc.kml', `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document>${_lineKmlStyleDefs(styles)}${placemarkXml}\n</Document>\n</kml>`);

// (기존 zip.generateAsync 부분 수정)
    const blob = await zip.generateAsync({ 
      type: 'blob', 
      compression: 'DEFLATE',
      mimeType: 'application/vnd.google-earth.kmz' // MIME 타입 추가
    });

    const url = URL.createObjectURL(blob);

    // 1. 공통 다운로드 태그 생성
    const a = document.createElement('a');
    a.href = url;
    // 확장자 강제 지정
    a.download = fileName.endsWith('.kmz') ? fileName : fileName + '.kmz';
    document.body.appendChild(a);

    // 2. 환경별 다운로드 실행
    if (isIOS) {
      // iOS 환경 대응
      window.open(url, '_blank');
    } else {
      // 안드로이드 및 PC 환경
      a.click();
    }

    // 3. 정리
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000); 
    
    hideLoading();
  } catch (err) {
    hideLoading();
    alert('KMZ 저장 중 오류: ' + err.message);
  }
}

// ─── 워커 압축 (OffscreenCanvas) ─────────────────────
// 사진 압축을 Web Worker 에서 수행 — 페이지 캔버스로 압축하면 파일 선택창을
// 다녀온 직후 지도 타일이 하얗게 죽는 기기가 있음 (압축 자체가 백화 원인).
// 워커는 페이지 렌더링/GPU 와 분리되어 지도에 영향을 주지 않는다.
const _imgWorkerCode = "self.onmessage=async e=>{const{id,file,max,target}=e.data;try{const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});let w=bmp.width,h=bmp.height;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}const cv=new OffscreenCanvas(w,h);cv.getContext('2d').drawImage(bmp,0,0,w,h);bmp.close();let q=0.85,blob=await cv.convertToBlob({type:'image/jpeg',quality:q});while(blob.size>target&&q>0.1){q=Math.round((q-0.05)*100)/100;blob=await cv.convertToBlob({type:'image/jpeg',quality:q});}const buf=await blob.arrayBuffer();self.postMessage({id,ok:true,buf},[buf]);}catch(err){self.postMessage({id,ok:false});}};";
let _imgWorker = null;
const _imgJobs = new Map();
let _imgJobId = 0;
function _getImgWorker() {
  if (_imgWorker !== null) return _imgWorker;
  try {
    if (typeof OffscreenCanvas === 'undefined' || typeof createImageBitmap === 'undefined' || typeof Worker === 'undefined') { _imgWorker = false; return false; }
    _imgWorker = new Worker(URL.createObjectURL(new Blob([_imgWorkerCode], { type: 'text/javascript' })));
    _imgWorker.onmessage = e => { const j = _imgJobs.get(e.data.id); if (j) { _imgJobs.delete(e.data.id); j(e.data); } };
    _imgWorker.onerror = () => { _imgJobs.forEach(j => j({ ok: false })); _imgJobs.clear(); };
  } catch(e) { _imgWorker = false; }
  return _imgWorker;
}
// 파일을 워커에서 압축해 JPEG dataURL 로 반환. 실패/미지원이면 null (호출측이 원본 사용).
function compressFileInWorker(file) {
  return new Promise(resolve => {
    const w = _getImgWorker();
    if (!w) return resolve(null);
    const id = ++_imgJobId;
    const to = setTimeout(() => { _imgJobs.delete(id); resolve(null); }, 20000);
    _imgJobs.set(id, d => {
      clearTimeout(to);
      if (!d.ok || !d.buf) return resolve(null);
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => resolve(null);
      fr.readAsDataURL(new Blob([d.buf], { type: 'image/jpeg' }));
    });
    try { w.postMessage({ id, file, max: 1920, target: COMPRESS_TARGET }); }
    catch(e) { clearTimeout(to); _imgJobs.delete(id); resolve(null); }
  });
}

// ─── 이미지 압축 (저장 시 500KB 이하) ────────────────
const _compressCache = new Map();   // 원본 src → 압축 결과 (같은 사진 매번 재압축 방지)
const COMPRESS_TARGET = 300 * 1024;
// JPEG 인코딩을 toBlob(비동기)으로 — toDataURL 은 메인 스레드를 수백 ms 씩 막아
// 사진 불러올 때 지도가 하얗게 멈추는 원인이었음. 실패 시 toDataURL 폴백.
function _canvasJpeg(cv, q) {
  return new Promise(res => {
    if (!cv.toBlob) return res(cv.toDataURL('image/jpeg', q));
    cv.toBlob(b => {
      if (!b) return res(cv.toDataURL('image/jpeg', q));
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => res(cv.toDataURL('image/jpeg', q));
      fr.readAsDataURL(b);
    }, 'image/jpeg', q);
  });
}
function compressImage(imgSrc) {
  if (_compressCache.has(imgSrc)) return Promise.resolve(_compressCache.get(imgSrc));
  // 이미 목표 크기 이하인 JPEG(불러올 때 만든 표시본 등)은 재압축 생략 — 자동저장 때마다
  // 전체 사진을 다시 canvas 인코딩하느라 지도가 멈추던 문제 방지
  if (/^data:image\/jpe?g/i.test(imgSrc) && imgSrc.length * 0.75 <= COMPRESS_TARGET * 1.2) {
    return Promise.resolve(imgSrc);
  }
  return new Promise(resolve => {
    const img = new Image();
    // 디코딩 실패(HEIC 등 미지원 포맷) 시 onload 가 영영 안 와서 불러오기/자동저장이
    // 통째로 멈추던 문제 — 원본 그대로 반환하고 계속 진행
    img.onerror = () => resolve(imgSrc);
    img.onload = async () => {
      const TARGET = COMPRESS_TARGET; // 표시본 목표 크기 (base64 환산 ≈ 400KB)
      const canvas = document.createElement('canvas');
      const MAX = 1920;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else       { w = Math.round(w * MAX / h); h = MAX; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      let quality = 0.85;
      let result = await _canvasJpeg(canvas, quality);
      // base64 길이 * 0.75 ≈ 실제 바이트
      while (result.length * 0.75 > TARGET && quality > 0.1) {
        quality = Math.round((quality - 0.05) * 100) / 100;
        result = await _canvasJpeg(canvas, quality);
      }
      // 원본 EXIF 복원 — canvas는 GPS·날짜·카메라 정보 등 EXIF를 모두 버리므로
      // 원본(imgSrc)에서 읽어 압축 결과에 다시 삽입
      try {
        const exif = piexif.load(imgSrc);
        if (exif['0th']) {
          delete exif['0th'][piexif.ImageIFD.UserComment];
          delete exif['0th'][piexif.ImageIFD.ImageDescription];
        }
        if (exif['Exif']) delete exif['Exif'][piexif.ExifIFD.UserComment];
        result = _exifSafeCarry(exif, result);
      } catch(e) {}
      canvas.width = canvas.height = 0;   // 캔버스 메모리 즉시 해제
      _compressCache.set(imgSrc, result);
      resolve(result);
    };
    img.src = imgSrc;
  });
}
// ─── 지도 종류 변경 (Kakao) ──────────────────────────
let _lastBaseType = 'HYBRID';
let _terrainOn = false, _cadastralOn = false;

function changeMapType(value) {
  if (_terrainOn)   { map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);      _terrainOn  = false; }
  if (_cadastralOn) { map.removeOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT); _cadastralOn = false; }
  if (value === 'TERRAIN') {
    map.setMapTypeId(kakao.maps.MapTypeId[_lastBaseType]);
    map.addOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
    _terrainOn = true;
  } else if (value === 'USE_DISTRICT') {
    map.setMapTypeId(kakao.maps.MapTypeId[_lastBaseType]);
    map.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
    _cadastralOn = true;
  } else {
    _lastBaseType = value;
    map.setMapTypeId(kakao.maps.MapTypeId[value]);
  }
}

function showLoading(msg) {
  document.getElementById('loadingMsg').textContent = msg || '불러오는 중...';
  document.getElementById('loading').classList.add('show');
}

// ─── 길게 누르기 ──────────────────────────────────────
const LONG_PRESS_MS = 600;
function attachLongPress(target, onLongPress) {
  let timer = null, startX = 0, startY = 0;
  function start(x, y) {
    startX = x; startY = y;
    suppressLongPress = true;  // 마커/선 위에서 누름 → 지도 롱프레스 차단
    if (typeof cancelMapPress === 'function') cancelMapPress();   // 위치 공유 타이머도 취소
    timer = setTimeout(() => { suppressLongPress = false; onLongPress(); }, LONG_PRESS_MS);
  }
  function cancel() { clearTimeout(timer); timer = null; suppressLongPress = false; }

  kakao.maps.event.addListener(target, 'touchstart', e => {
    const t = e.changedTouches ? e.changedTouches[0] : e;
    start(t.clientX, t.clientY);
  });
  kakao.maps.event.addListener(target, 'touchend', cancel);
  kakao.maps.event.addListener(target, 'touchmove', e => {
    const t = e.changedTouches ? e.changedTouches[0] : e;
    if (Math.abs(t.clientX - startX) > 8 || Math.abs(t.clientY - startY) > 8) cancel();
  });
  kakao.maps.event.addListener(target, 'mousedown', e => {
    if (e && e.button != null && e.button !== 0) return;
    try {
      const point = map.getProjection().pointFromCoords(
        target.getPosition ? target.getPosition() : target.getPath()[0]
      );
      start(point.x, point.y);
    } catch (_) {}
  });
  kakao.maps.event.addListener(target, 'mouseup', cancel);
}

// ─── 랜덤 색 (KMZ 스타일 없는 선) ────────────────────
function randColor() { return '#' + Math.floor(Math.random()*0xFFFFFF).toString(16).padStart(6,'0'); }

// ─── CAD 문자(kind=text) 텍스트 라벨 — 마커 없이 글자만(회전 포함) ──
// map.html addTextLabel 이식. 자동저장/내보내기 복원을 위해 좌표·회전·색을 함께 보관.
let textLabels = [];

function _mapMetersPerPixel() {
  try {
    const proj = map.getProjection();

    const R = 6371000, toR = Math.PI / 180,
      dLa = (c2.getLat() - c.getLat()) * toR, dLo = (c2.getLng() - c.getLng()) * toR,

      a = sa * sa + Math.cos(c.getLat() * toR) * Math.cos(c2.getLat() * toR) * sb * sb;

function addTextLabel(latlng, text, rot, color, h, ax, ay) {

    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const col = /^#[0-9a-fA-F]{6}$/.test(color || '') ? color : '#FFEB00';
  h = Number(h) || 0;
  // 앵커(CAD 정렬): ax 0=왼쪽 0.5=중앙 1=오른쪽 / ay 0=아래 0.5=중간 1=위 (화면 yAnchor=1-ay)
  ax = isFinite(Number(ax)) ? Number(ax) : 0;
  ay = isFinite(Number(ay)) ? Number(ay) : 0;
  const xa = h > 0 ? ax : 0.5;
  // ay=0(베이스라인)은 글상자 맨아래(1.0)가 아니라 밑선 위치(0.8)에 앵커 — CAD 기준점과 일치
  const ya = h > 0 ? (ay < 0.25 ? 0.8 : 1 - ay) : 0.5;
  // CAD 회전(반시계, 도) -> 화면 CSS 회전(시계 양수)이라 부호 반전. h 있으면 줌 연동 크기.
  const el = document.createElement('div');
  el.style.cssText =
    // 좌표점 고정 + CSS 정렬(dmap 방식): translate%는 요소 크기 비례라
    // 줌으로 글자 px가 바뀌어도 기준점이 절대 안 움직임
    'transform:translate(' + (-xa * 100) + '%,' + (-ya * 100) + '%) rotate(' + (-(Number(rot) || 0)) + 'deg);' +
    'transform-origin:' + (xa * 100) + '% ' + (ya * 100) + '%;' +
    'white-space:nowrap;font-size:13px;' +
    'font-weight:bold;line-height:1;color:' + col + ';pointer-events:none;' +
    'text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 2px #000;';
  el.innerHTML = safe;
  const ov = new kakao.maps.CustomOverlay({ map, content: el, position: latlng, xAnchor: 0, yAnchor: 0, zIndex: 6 });
  const o = { ov, el, name: String(text == null ? '' : text), rot: Number(rot) || 0,
              color: col, pos: latlng, h, ax, ay };
  textLabels.push(o);
  if (h > 0) _applyTextLabelSize(o, _mapMetersPerPixel());
}
// 줌 변경 시 h 있는 라벨 px 재계산 (h[m] ÷ m/px). 2px 미만 숨김(축소 시 겹침 방지)
function _applyTextLabelSize(o, mpp) {
  if (!(o.h > 0) || !(mpp > 0)) return;
  const px = o.h * 1.1 / mpp;   // 크기 보정 x1.1 (사용자 체감 확정값 — 여기 숫자만 바꾸면 됨)

}
function clearTextLabels() {
  textLabels.forEach(t => t.ov.setMap(null));
  textLabels = [];
}

// ─── 묶음선 뷰포트 컬링 + 줌별 점 단순화 (map.html cullBundlePolys 이식) ──
// Kakao 는 오버레이의 '전체' 좌표를 줌/이동 때마다 SVG 로 다시 그린다(뷰포트 클리핑 없음)

  const w = swp.getLng() - lngSpan * 0.3, e = nep.getLng() + lngSpan * 0.3;

  for (const en of polylines) {
    const pl = en.poly;
    if (!pl || !pl._parts) continue;
    // 좌표 숫자 캐시 (getLat/getLng 반복 호출 절약)
    if (!pl._pnum) pl._pnum = pl._parts.map(part => part.map(p => [p.getLat(), p.getLng()]));
    const parts = [];
    for (let pi = 0; pi < pl._parts.length; pi++) {

      if (prevIn) { run = [part[0]]; run._la = pla; run._lo = plo; parts.push(run); }
      for (let i = 1; i < num.length; i++) {
        const la = num[i][0], lo = num[i][1];
        const pin = (la >= s && la <= n && lo >= w && lo <= e);
        let segIn = pin || prevIn;
        if (!segIn) {
          // 양 끝점이 밖이어도 화면을 '가로지르는' 선분은 포함 (선분 bbox 교차 판정)
          const l1 = Math.min(pla, la), l2 = Math.max(pla, la);
          const g1 = Math.min(plo, lo), g2 = Math.max(plo, lo);
          segIn = !(l2 < s || l1 > n || g2 < w || g1 > e);
        }
        if (segIn) {
          if (!run) { run = [part[i - 1]]; run._la = pla; run._lo = plo; parts.push(run); }
          // 단순화: 마지막 채택점과 eps 이상 떨어졌거나 / 구간 끝 / 화면 이탈점이면 채택

          if (!pin) run = null;   // 화면 밖으로 나감 → 다음 교차 구간은 새 run

// ─── 트랙 → KML Placemark 직렬화 (내보내기/자동저장 공용) ──

function _hasPt(store, kind, lat, lng, name) {
  const a = store.pts.get(_ptKey(kind, name));
  if (!a) return false;
  for (const p of a) if (Math.abs(p[0] - lat) < _PT_EPS && Math.abs(p[1] - lng) < _PT_EPS) return true;
  return false;
}
function _addPt(store, kind, lat, lng, name) {
  const k = _ptKey(kind, name);
  const a = store.pts.get(k);
  if (a) a.push([lat, lng]); else store.pts.set(k, [[lat, lng]]);
}
// 지금 지도에 있는 모든 객체 { lines:Set, pts:Map }
function _existingSigs() {
  const store = { lines: new Set(), pts: new Map() };
  for (const en of polylines) {
    if (!en.poly) continue;
    const parts = (en.parts && en.parts.length) ? en.parts : [en.path || []];
    store.lines.add(_sigLine(en.color || '', en.width || 0, parts));
  }
  for (const m of markers) {
    if (!m.marker) continue;
    const p = m.marker.getPosition();
    _addPt(store, 'M', p.getLat(), p.getLng(), m.name);
  }
  for (const t of textLabels) _addPt(store, 'T', t.pos.getLat(), t.pos.getLng(), t.name);
  return store;
}

async function loadHTM(file) {
  showLoading('HTM 읽는 중...');
  let D;
  try {
    const text = await file.text();
    D = { LINES:  _htmArr(text, 'LINES'),  POLYS:   _htmArr(text, 'POLYS'),
          TEXTS:  _htmArr(text, 'TEXTS'),  MARKERS: _htmArr(text, 'MARKERS'),
          PHOTOS: _htmArr(text, 'PHOTOS') };
  } catch (err) { hideLoading(); alert('HTM 오류: ' + err.message); return; }
  return _loadHtmData(D);
}

// 위 배열들을 실제로 지도에 그린다.
// 파일에서 읽은 경우(loadHTM)와 런처 htm 이 postMessage 로 보낸 경우(_installLinkReceiver)가 공유한다.
async function _loadHtmData(D) {
  showLoading('HTM 읽는 중...');
  const _deferPolys = [];
  try {
    const LINES  = D.LINES  || [], POLYS   = D.POLYS   || [],
          TEXTS  = D.TEXTS  || [], MARKERS = D.MARKERS || [],
          PHOTOS = D.PHOTOS || [];
    if (!LINES.length && !POLYS.length && !TEXTS.length && !MARKERS.length && !PHOTOS.length) {
      hideLoading();
      alert('이 HTM 파일에서 지도 데이터를 찾지 못했습니다.\n(KMZ → HTM 로 변환된 지도 파일만 열 수 있습니다)');
      return;
    }

    const bounds = new kakao.maps.LatLngBounds();
    const LL = a => { const l = new kakao.maps.LatLng(a[0], a[1]); bounds.extend(l); return l; };
    // 같은 파일을 두 번 열어도 이미 있는 객체는 건너뛴다
    const sigs = _existingSigs();
    let skipped = 0;

    // 선 + 폴리곤(외곽선) — 원본 도면 순서(z)대로
    const shapes = LINES.concat(POLYS).sort((a, b) => (a.z || 0) - (b.z || 0));
    shapes.forEach(g => {
      const parts = (g.p || []).map(part => part.map(LL)).filter(p => p.length >= 2);
      if (!parts.length) return;
      const color = /^#[0-9a-fA-F]{6}$/.test(g.c || '') ? g.c : randColor();
      // Kakao는 선 굵기를 정수 px로 렌더 → 소수 굵기(1.4 등)는 올림
      const width = Math.max(1, Math.ceil(Number(g.w) || 4));
      const sig = _sigLine(color, width, parts);
      if (sigs.lines.has(sig)) { skipped++; return; }
      sigs.lines.add(sig);
      const poly = new kakao.maps.Polyline({
        path: parts.length === 1 ? parts[0] : parts,
        strokeWeight: width, strokeColor: color,
        strokeOpacity: (g.o != null ? g.o : 1), strokeStyle: 'solid'
      });
      if (parts.length > 1) poly._parts = parts;
      _deferPolys.push(poly);
      const entry = { poly, name: '선', path: parts.length === 1 ? parts[0] : parts.flat(),
                      parts: parts.length > 1 ? parts : null, color, width };
      attachPolylineDelete(poly, entry);
      polylines.push(entry);
    });

    // CAD 문자 라벨 [lat,lng,내용,rot,color,h,ax,ay,tw]
    // (건너뛴 객체도 LL() 로 좌표를 먼저 반영해 화면 맞춤 범위는 파일 전체 기준이 되게)
    TEXTS.forEach(t => {
      if (!t || t.length < 3) return;
      const ll = LL(t);
      const name = String(t[2] == null ? '' : t[2]);
      if (_hasPt(sigs, 'T', t[0], t[1], name)) { skipped++; return; }
      _addPt(sigs, 'T', t[0], t[1], name);
      addTextLabel(ll, t[2], t[3] || 0, t[4] || '', t[5] || 0, t[6] || 0, t[7] || 0);
    });

    // 일반 마커 [lat,lng,이름]
    MARKERS.forEach(m => {
      if (!m || m.length < 2) return;
      const ll = LL(m);
      const name = m[2] || '마커';
      if (_hasPt(sigs, 'M', m[0], m[1], name)) { skipped++; return; }
      _addPt(sigs, 'M', m[0], m[1], name);
      addMarker(ll, name);
    });

    // 사진 마커 [lat,lng,이름,dataURL]
    for (let i = 0; i < PHOTOS.length; i++) {
      const ph = PHOTOS[i];
      if (!ph || ph.length < 4 || !ph[3]) continue;
      const ll = LL(ph);
      const name = ph[2] || '사진';
      if (_hasPt(sigs, 'M', ph[0], ph[1], name)) { skipped++; continue; }
      _addPt(sigs, 'M', ph[0], ph[1], name);
      addPhotoMarker(ll, ph[3], name);
      if (i % 5 === 0) {
        showLoading(`사진 불러오는 중... (${i + 1} / ${PHOTOS.length})`);
        await new Promise(r => setTimeout(r, 0));
      }
    }

    if (!bounds.isEmpty()) map.setBounds(bounds);
    if (skipped) showToastMsg('이미 있는 객체 ' + skipped + '개는 건너뛰었습니다');
    _deferPolys.forEach(p => { if (!p._parts) p.setMap(map); });
    cullBundlePolys();
    hasData = true;
    document.getElementById('saveBtn').disabled = false;
    hideLoading();
  } catch (err) {
    hideLoading();
    try { _deferPolys.forEach(p => { if (!p._parts && !p.getMap()) p.setMap(map); }); cullBundlePolys(); } catch(e) {}
    alert('HTM 오류: ' + err.message);
  }
}

async function loadKMZ(file, silent = false) {
  if (!silent) showLoading('KMZ 압축 해제 중...');
  else showLoading('이전 데이터 복원 중...');

  // DB 자동 복원(silent)일 때만 기존 데이터 초기화
  // 사용자가 직접 불러올 때는 기존 마커/선 유지하고 추가
  if (silent) {
    markers.forEach(m => { m.iw.close(); m.marker.setMap(null); });
    markers = [];
    polylines.forEach(p => p.poly.setMap(null));
    polylines = [];
    clearTextLabels();
    hasData = false;
    document.getElementById('saveBtn').disabled = true;
  }

  // 선은 파싱 중엔 지도에 안 붙이고 모아뒀다가 setBounds 후 한 번에 붙인다.
  // (파싱 중 map 에 붙이면 현재 줌에서 그리고, setBounds 로 화면이 바뀌며 전부
  //  다시 그려 이중 렌더 → 대형 KMZ 로딩이 느렸음. map.html 과 동일 방식)
  const _deferPolys = [];
  try {
    // KMZ(zip)는 'PK'(0x50 0x4B)로 시작. 평문 .kml 은 zip 이 아니므로 헤더로 판별.
    let zip = null, zipFiles = [], kmlText = null;
    const head = new Uint8Array(await file.slice(0, 2).arrayBuffer());
    const isZip = head[0] === 0x50 && head[1] === 0x4B;
    if (!isZip) {
      if (!/\.kml$/i.test(file.name)) { alert('KMZ / ZIP / KML 파일만 불러올 수 있습니다.'); hideLoading(); return; }
      kmlText = await file.text();   // 평문 KML (내부 임베드 사진 없음 — 마커/트랙만)
    } else {
    zip = await JSZip.loadAsync(file);
    zipFiles = Object.keys(zip.files);

    // 파일명에 널문자(\u0000)가 포함된 경우 제거 후 탐색
    for (const name of zipFiles) {
      const cleanName = name.replace(/\0/g, '');
      if (/\.kml$/i.test(cleanName)) {
        try {
          const text = await zip.files[name].async('string');
          if (text && text.length > 0) { kmlText = text; break; }
        } catch(e) {}
      }
    }
    if (!kmlText) { alert('.kml 파일을 읽을 수 없습니다.\n포함된 파일:\n' + zipFiles.map(n=>n.replace(/\0/g,'')).join('\n')); hideLoading(); return; }
    }

    showLoading('데이터 읽는 중...');
    const xml = new DOMParser().parseFromString(kmlText, 'application/xml');
    // Folder 안에 있는 Placemark도 모두 포함
    const placemarks = Array.from(xml.getElementsByTagName('Placemark'));
    const bounds = new kakao.maps.LatLngBounds();

    // KML 스타일 맵 (styleUrl -> 색·굵기). KML 색은 aabbggrr 순서. (map.html 이식)
    const styleColors = {}, styleWidths = {};
    const kmlC2Hex = c => { c = (c||'').trim(); if (c.length < 8) return null; return '#' + c.slice(6,8) + c.slice(4,6) + c.slice(2,4); };
    for (const st of Array.from(xml.getElementsByTagName('Style'))) {
      const id = st.getAttribute('id'); if (!id) continue;
      const cs = (st.getElementsByTagName('LineStyle')[0] || st.getElementsByTagName('PolyStyle')[0]);
      const h = kmlC2Hex(cs?.getElementsByTagName('color')[0]?.textContent);
      if (h) styleColors['#'+id] = h;
      const w = parseFloat(cs?.getElementsByTagName('width')[0]?.textContent);
      if (!isNaN(w)) styleWidths['#'+id] = w;
    }

    for (let i = 0; i < placemarks.length; i++) {
      const pm = placemarks[i];
      const pmName = pm.getElementsByTagName('name')[0]?.textContent?.trim()
                  || pm.getElementsByTagName('n')[0]?.textContent?.trim()
                  || '설명 없음';

      // 이미지 경로 방법 1: Data 태그 (기존 방식)
      let photoFilename = '';
      for (const d of Array.from(pm.getElementsByTagName('Data'))) {
        if (d.getAttribute('name') === 'photoFile') {
          photoFilename = d.getElementsByTagName('value')[0]?.textContent || '';
          break;
        }
      }

      // 이미지 경로 방법 2: description 안 <img src="..."> 추출 (CDATA 포함)
      if (!photoFilename) {
        const descEl = pm.getElementsByTagName('description')[0];
        if (descEl) {
          const descText = descEl.textContent || '';
          const imgMatch = descText.match(/src=["']([^"']+\.(jpe?g|png))["']/i)
                        || descText.match(/src=([^\s>]+\.(jpe?g|png))/i);
          if (imgMatch) {
            const thumbPath = imgMatch[1].trim();
            const rollPath = thumbPath.replace('_thumb.', '_roll.');
            const rollEntry = zipFiles.find(z => z === rollPath || z.endsWith('/' + rollPath.split('/').pop()));
            photoFilename = rollEntry ? rollPath : thumbPath;
          }
        }
      }

      // ── 선/폴리곤 도형 전부 수집 (MultiGeometry 안의 모든 LineString + Polygon 링) ──
      const coordEls = [];
      for (const ls of Array.from(pm.getElementsByTagName('LineString')))
        coordEls.push(ls.getElementsByTagName('coordinates')[0]);
      for (const pg of Array.from(pm.getElementsByTagName('Polygon')))
        for (const lr of Array.from(pg.getElementsByTagName('LinearRing')))
          coordEls.push(lr.getElementsByTagName('coordinates')[0]);

      const point = pm.getElementsByTagName('Point')[0];

      if (coordEls.length) {
        const su = pm.getElementsByTagName('styleUrl')[0]?.textContent?.trim();
        const color = (su && styleColors[su]) || randColor();
        // Kakao는 선 굵기를 정수 px로 렌더 → 소수 굵기(0.6 등)는 올림(ceil)으로 구분
        const sw = (su && styleWidths[su] != null) ? Math.max(1, Math.ceil(styleWidths[su])) : 4;
        // Placemark 하나(MultiGeometry 포함)의 모든 선을 멀티파트 Polyline 1개로 —
        // 선별 개별 Polyline 은 수천 개 KMZ 에서 pan/zoom 버벅임 (map.html 과 동일 경량화).
        // 원본 경로는 _parts/entry.parts 에 보관(getPath()가 멀티파트를 유실하므로 저장용).
        const parts = [];
        for (const ce of coordEls) {
          const coordsText = ce?.textContent || '';
          const pts = coordsText.trim().split(/\s+/).map(c => {
            const [lng, lat] = c.split(',').map(Number);
            return new kakao.maps.LatLng(lat, lng);
          }).filter(ll => !isNaN(ll.getLat()) && !isNaN(ll.getLng()));
          if (pts.length < 2) continue;
          pts.forEach(p => bounds.extend(p));
          parts.push(pts);
        }
        if (parts.length) {
          const poly = new kakao.maps.Polyline({ path: parts.length === 1 ? parts[0] : parts, strokeWeight: sw, strokeColor: color, strokeOpacity: 1 });
          if (parts.length > 1) poly._parts = parts;   // 단일 경로는 점 편집 가능 — getPath()로 최신 경로 사용
          _deferPolys.push(poly);   // setBounds 후 한 번에 setMap
          const entry = { poly, name: pmName, path: parts.length === 1 ? parts[0] : parts.flat(), parts: parts.length > 1 ? parts : null, color, width: sw };
          attachPolylineDelete(poly, entry);
          polylines.push(entry);
        }
      } else if (point && (() => {
        // ── CAD 문자(kind=text): 마커 대신 회전 텍스트 라벨만 그림 ──
        for (const d of Array.from(pm.getElementsByTagName('Data'))) {
          if (d.getAttribute('name') === 'kind')
            return (d.getElementsByTagName('value')[0]?.textContent || '').trim() === 'text';
        }
        return false;
      })()) {
        const ct = point.getElementsByTagName('coordinates')[0]?.textContent || '';
        const [lng, lat] = ct.trim().split(',').map(Number);
        if (!isNaN(lat) && !isNaN(lng)) {
          let _rot = 0, _col = '', _h = 0, _ax = 0, _ay = 0;
          for (const d of Array.from(pm.getElementsByTagName('Data'))) {
            const nm = d.getAttribute('name'); const v = d.getElementsByTagName('value')[0]?.textContent || '';
            if (nm === 'rot') _rot = parseFloat(v) || 0; else if (nm === 'color') _col = v.trim();
            else if (nm === 'h') _h = parseFloat(v) || 0;
            else if (nm === 'ax') _ax = parseFloat(v) || 0; else if (nm === 'ay') _ay = parseFloat(v) || 0;
          }
          const ll = new kakao.maps.LatLng(lat, lng); bounds.extend(ll);
          addTextLabel(ll, pmName, _rot, _col, _h, _ax, _ay);
        }
      } else if (point) {
        const coordsText = point.getElementsByTagName('coordinates')[0]?.textContent || '';
        const [lng, lat] = coordsText.trim().split(',').map(Number);
        if (isNaN(lat) || isNaN(lng)) continue;
        const ll = new kakao.maps.LatLng(lat, lng);
        bounds.extend(ll);

        if (photoFilename) {
          // files/, images/, photo/ 등 다양한 경로 후보 탐색 (널문자 제거 후 비교)
          const baseName = photoFilename.split('/').pop();
          let photoZipFile = null;
          for (const name of zipFiles) {
            const cleanName = name.replace(/\0/g, '');
            if (cleanName === photoFilename ||
                cleanName === `files/${photoFilename}` ||
                cleanName === `images/${baseName}` ||
                cleanName === `photo/${baseName}` ||
                cleanName.endsWith('/' + baseName) ||
                cleanName === baseName) {
              photoZipFile = zip.files[name];
              break;
            }
          }
          if (photoZipFile) {
            const base64 = await photoZipFile.async('base64');
            const ext = baseName.split('.').pop().toLowerCase();
            const mime = ext === 'png' ? 'image/png' : 'image/jpeg';
            addPhotoMarker(ll, `data:${mime};base64,${base64}`, pmName);
            // 저장된 사진 메타(설명/촬영일시) 복원
            const _en = markers[markers.length - 1];
            if (_en) {
              for (const d of Array.from(pm.getElementsByTagName('Data'))) {
                const nm = d.getAttribute('name'); const v = d.getElementsByTagName('value')[0]?.textContent || '';
                if (nm === 'desc') _en.desc = v; else if (nm === 'taken') _en.taken = v;
                else if (nm === 'orig') _en.origKey = v;   // 원본 보관소 키 (이 기기 DB에 있을 때만 유효)
              }
            }
          } else {
            addMarker(ll, pmName);
          }
        } else {
          addMarker(ll, pmName);
        }
      }

      if (i % 10 === 0) {
        showLoading(`마커 생성 중... (${i + 1} / ${placemarks.length})`);
        await new Promise(r => setTimeout(r, 0));
      }
    }

    if (!bounds.isEmpty()) map.setBounds(bounds);
    // 화면(줌) 확정 후 한 번만 그림. 묶음선(_parts)은 컬링이 화면 교차 구간만 붙임.
    _deferPolys.forEach(p => { if (!p._parts) p.setMap(map); });
    cullBundlePolys();
    hasData = true;
    document.getElementById('saveBtn').disabled = false;
    hideLoading();
  } catch (err) {
    hideLoading();
    // 오류 전까지 파싱된 선은 그대로 표시 (숨은 채 남지 않게)
    try { _deferPolys.forEach(p => { if (!p._parts && !p.getMap()) p.setMap(map); }); cullBundlePolys(); } catch(e) {}
    alert('오류: ' + err.message);
  }
}
</script>

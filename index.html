<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KMZ뷰어">
  <meta name="theme-color" content="#1a73e8">
  <title>KMZ 뷰어</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
  <!-- 뒤로가기로 앱이 종료되지 않도록 Kakao 로딩보다 먼저 버퍼 설치 -->
  <!-- addEventListener 사용: window.onpopstate=null 로 덮어쓰는 외부 라이브러리에 영향 안 받음 -->
  <script>
  history.replaceState({k:0},'','');
  history.pushState({k:1},'','');
  history.pushState({k:2},'','');
  function _earlyBackHandler(){ history.forward(); }
  window.addEventListener('popstate', _earlyBackHandler);
  </script>
  <!-- ── API 키: 고정(하드코딩). 이 폴더 파일들은 아래 JavaScript 키로 동작 ── -->
  <script>
  var KAKAO_JS_KEY = '94bf4516825c146467eb2318cd55b782';
  document.write('<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + KAKAO_JS_KEY
    + '&autoload=false&libraries=services"><\/script>');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/piexifjs"></script>
  <!-- exifr: 삼성 등 일부 폰 카메라 JPEG 은 piexif 가 GPS 를 못 읽음 — 읽기 폴백 -->
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    #map { width: 100%; height: 100%; }

    /* ── 주소표시 (검색박스 바로 아래) ── */
    #address-display {
      margin-top: 5px; width: max-content;
      background: rgba(0,0,0,0.62); color: white; font-size: 13px;
      padding: 5px 10px; border-radius: 6px; pointer-events: auto; cursor: pointer;
      white-space: nowrap; max-width: calc(100vw - 20px);
      overflow: hidden; text-overflow: ellipsis; text-align: left;
    }
    /* 주소를 못 찾아 빈 문자열이 들어가면 빈 검은 알약이 남는다 → 숨김 */
    #address-display:empty { display: none; }

    /* ── 검색 (좌측 상단, 좁게) ── */
    /* 세로 flex — 검색줄 / 주소표시 / 검색결과 순서로 쌓인다 */
    #searchBox { position: absolute; top: 10px; left: 10px; z-index: 2100; width: 176px;
                 display: flex; flex-direction: column; align-items: flex-start; }
    #searchRow {
      display: flex; align-items: center; width: 100%;
      background: rgba(255,255,255,0.96); border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3); overflow: hidden;
    }
    #searchInput {
      flex: 1; min-width: 0; border: none; outline: none; background: transparent;
      padding: 7px 2px 7px 9px; font-size: 16px; font-family: inherit; color: #222;
    }
    #searchInput::placeholder { color: #999; font-size: 13px; }
    #searchGo, #searchClear { border: none; background: transparent; cursor: pointer; padding: 0; flex-shrink: 0; font-size: 15px; color: #555; }
    #searchGo { width: 32px; height: 34px; }
    #searchClear { width: 22px; height: 34px; display: none; color: #aaa; font-size: 16px; }
    #searchClear.show { display: block; }
    #searchResults {
      display: none; margin-top: 5px; width: 250px; max-width: calc(100vw - 20px);
      background: #fff; border-radius: 8px; box-shadow: 0 3px 14px rgba(0,0,0,0.3);
      max-height: 46vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    #searchResults.show { display: block; }
    .sr-item { padding: 8px 10px; border-bottom: 1px solid #eee; cursor: pointer; }
    .sr-item:last-child { border-bottom: none; }
    .sr-item:active { background: #eef3fb; }
    .sr-t { font-size: 13px; font-weight: 600; color: #222; word-break: keep-all; }
    .sr-a { font-size: 11px; color: #777; margin-top: 2px; word-break: keep-all; }
    .sr-msg { padding: 10px; font-size: 12px; color: #888; text-align: center; }

    .btn {
      position: absolute; z-index: 1000;
      background: white; border: none; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; width: 48px; height: 48px;
      touch-action: manipulation;   /* 더블탭 확대 대기 제거 → 탭 즉시 click 발생 */
    }
    #saveBtn { top: 16px; right: 72px; }
    #saveBtn:disabled { opacity: 0.4; cursor: not-allowed; }
    #loadBtn { top: 16px; right: 16px; }
    #myLocationBtn { top: 72px; right: 16px; padding: 0; transition: background 0.2s; }
    /* 1단계: 내위치만 표시 (하늘색) */
    #myLocationBtn.loc-show { background: #e3f2fd; box-shadow: 0 2px 8px rgba(79,195,247,0.5); }
    #myLocationBtn.loc-show svg path, #myLocationBtn.loc-show svg circle { stroke: #039be5; }
    /* 2단계: 위치 따라가기 (파란색) */
    #myLocationBtn.loc-follow { background: #1a73e8; box-shadow: 0 2px 8px rgba(26,115,232,0.6); }
    #myLocationBtn.loc-follow svg path, #myLocationBtn.loc-follow svg circle { stroke: white; }
    #drawBtn { top: 128px; right: 16px; padding: 0; transition: background 0.2s; font-size: 18px; }
    #drawBtn.active { background: #e53935; box-shadow: 0 2px 8px rgba(219,68,55,0.6); }
    /* 선그리기 색/굵기 버튼 (그리기 중에만 표시) */
    #drawStyleBtn { top: 128px; right: 72px; display: none; font-size: 18px; }
    #drawStyleBtn.show { display: flex; }
    #drawStyleBtn .dsb-line { width: 26px; border-radius: 3px; background: #FF5733; height: 4px; }
    #markerBtn { top: 184px; right: 16px; padding: 0; transition: background 0.2s; font-size: 20px; }
    #markerBtn.active { background: #43a047; box-shadow: 0 2px 8px rgba(67,160,71,0.6); }
    /* 오른쪽 한 줄: … 마커 → 지우개(선택삭제) → 빗자루(전체삭제)
       되돌리기는 지우개 왼쪽에, 지우개 모드에서 실제로 지웠을 때만 나타난다 */
    #eraseBtn { top: 240px; right: 16px; padding: 0; transition: background 0.2s; }
    #eraseBtn.active { background: #ffcdd2; box-shadow: 0 2px 8px rgba(229,57,53,0.6); }
    #undoBtn { top: 240px; right: 72px; padding: 0; display: none; font-size: 20px; }
    #undoBtn.show { display: flex; }
    #clearBtn { top: 296px; right: 16px; padding: 0; transition: background 0.2s; }

    /* 마커 조준원 */
    #crosshair {
      display: none; position: fixed;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 40px; height: 40px;
      border: 3px solid #e53935; border-radius: 50%;
      pointer-events: none; z-index: 2000;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
    }
    #crosshair::after {
      content: ''; position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 7px; height: 7px;
      background: #e53935; border-radius: 50%;
    }
    #crosshair.show { display: block; }

    /* 마커 수정/삭제 모달 */
    #markerEditModal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 7500;
      align-items: flex-start; justify-content: center;
    }
    #markerEditModal.show { display: flex; }
    #markerEditModalBox {
      background: white; width: 100%; max-width: 480px;
      border-radius: 0 0 16px 16px;
      padding: 20px 20px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
      animation: slideDown 0.22s ease;
    }
    #markerEditModal h3 { margin: 0 0 14px; font-size: 16px; color: #333; }
    #markerEditNameInput {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 15px; outline: none;
      transition: border-color 0.15s; margin-bottom: 14px;
    }
    #markerEditNameInput:focus { border-color: #1a73e8; }
    .edit-modal-btns { display: flex; gap: 10px; }
    .edit-modal-btns button {
      flex: 1; padding: 12px; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    #editSaveBtn  { background: #1a73e8; color: white; }
    #editDeleteBtn{ background: #e53935; color: white; }
    #editCancelBtn{ background: #f1f3f4; color: #555; }
    #editMoveBtn  { background: #00897b; color: white; }
    #markerEditModalBox .edit-modal-btns button { font-size: 13px; padding: 10px 4px; }

    /* ── 이동 힌트 ── */
    #moveHint {
      display: none; position: fixed; bottom: 100px;
      left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.84); color: white; font-size: 13px;
      padding: 10px 18px; border-radius: 12px; z-index: 5100;
      pointer-events: auto; text-align: center; white-space: nowrap;
    }
    #moveHint.show { display: block; }
    #moveHint .mh-row { margin-top: 8px; display: flex; gap: 8px; justify-content: center; }
    #moveHint .mh-row button { padding: 6px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    #moveHint .mh-ok  { background: #1a73e8; color: white; }
    #moveHint .mh-cancel { background: #555; color: white; }

    /* ── 지도종류 선택 ── */
    /* 오른쪽 버튼 줄이 빗자루까지 296px 를 쓰므로 한 칸 아래(352px) */
    #mapTypeBox { position: absolute; z-index: 1000; top: 352px; right: 16px; }
    #mapTypeBox select {
      width: 48px; padding: 5px 1px; border: none; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3); font-size: 11px;
      background: white; cursor: pointer; text-align: center;
    }

    /* ── 선 스타일 피커 (색상/굵기) ── */
    #stylePicker {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 9500;
      align-items: center; justify-content: center;
    }
    #stylePicker.show { display: flex; }
    #stylePickerBox {
      background: white; border-radius: 14px;
      padding: 18px 18px 16px; width: 300px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    }
    #stylePickerBox h3 { margin: 0 0 12px; font-size: 15px; color: #333; }
    .sp-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; margin-bottom: 14px; }
    .sp-swatch {
      width: 100%; aspect-ratio: 1; border-radius: 50%;
      border: 1.5px solid rgba(0,0,0,0.18); cursor: pointer; padding: 0;
    }
    .sp-swatch.sel { outline: 3px solid #1a73e8; outline-offset: 2px; }
    .sp-widths { display: flex; gap: 6px; margin-bottom: 14px; }
    .sp-w {
      flex: 1; height: 38px; border: 1.5px solid #ddd; border-radius: 8px;
      background: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center; padding: 0 4px;
    }
    .sp-w.sel { border-color: #1a73e8; background: #e8f0fe; }
    .sp-w span { display: block; width: 100%; border-radius: 2px; background: #444; }
    #spCloseBtn {
      width: 100%; padding: 11px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      background: #f1f3f4; color: #555;
    }

    /* 선 컨텍스트 메뉴 */
    #polyMenu {
      display: none; position: fixed; z-index: 9000;
      background: white; border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      overflow: hidden; min-width: 140px;
    }
    #polyMenu.show { display: block; }
    #polyMenu button {
      display: block; width: 100%; padding: 13px 18px;
      border: none; background: none; text-align: left;
      font-size: 15px; cursor: pointer;
    }
    #polyMenu button:hover { background: #f1f3f4; }
    #polyMenu button.danger { color: #e53935; }

    /* CSS scale 줌 버튼 */
    #zoomBtns {
      position: absolute; z-index: 1000;
      right: 16px; bottom: 32px;
      display: flex; flex-direction: column; gap: 4px;
    }
    #zoomBtns button {
      width: 48px; height: 48px;
      background: white; border: none; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      font-size: 26px; font-weight: 300; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #333;
      touch-action: manipulation;
    }
    #zoomBtns button:active { background: #f1f3f4; }
    .distance-overlay {
      background: white; border: 1.5px solid #db4040;
      padding: 4px 8px; border-radius: 6px;
      font-size: 12px; font-weight: 600; color: #db4040;
      white-space: nowrap; pointer-events: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    #myLocationBtn svg { width: 26px; height: 26px; }
    #fileInput { display: none; }

    /* 로딩 */
    #loading {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 9999;
      flex-direction: column; gap: 12px;
      align-items: center; justify-content: center;
      color: white; font-size: 15px;
    }
    #loading.show { display: flex; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 삭제 힌트 토스트 */
    #deleteHint {
      display: none; position: fixed;
      bottom: 32px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: white;
      font-size: 13px; padding: 8px 16px;
      border-radius: 20px; z-index: 5000;
      pointer-events: none; white-space: nowrap;
    }
    #deleteHint.show { display: block; }

    /* 사진 InfoWindow */
    .photo-iw { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.35); max-width: 300px; }
    .photo-iw-header { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; font-size: 13px; font-weight: bold; border-bottom: 1px solid #eee; gap: 6px; }
    .photo-iw-header .iw-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .photo-iw-header .iw-map-btn { font-size: 15px; cursor: pointer; line-height: 1; }
    .photo-iw-header .iw-close { cursor: pointer; color: #999; font-size: 14px; line-height: 1; }
    .photo-iw img { width: 100%; max-height: 260px; object-fit: cover; display: block; cursor: zoom-in; }

    /* 전체화면 사진 뷰어 */
    #photoViewer {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.9); z-index: 8000;
      align-items: center; justify-content: center;
      flex-direction: column; padding: 16px;
    }
    #photoViewer.show { display: flex; }
    #photoViewer img { max-width: 100%; max-height: 85vh; border-radius: 8px; object-fit: contain; }
    #photoViewer .pv-name { color: rgba(255,255,255,0.8); font-size: 13px; margin-top: 10px; }

    /* 마커 추가 모달 */
    #markerModal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 7000;
      align-items: flex-start; justify-content: center;
    }
    #markerModal.show { display: flex; }
    #markerModalBox {
      background: white; width: 100%; max-width: 480px;
      border-radius: 0 0 16px 16px;
      padding: 20px 20px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
      animation: slideDown 0.22s ease;
    }
    @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
    #markerModal h3 { margin: 0 0 14px; font-size: 16px; color: #333; }
    #markerNameInput {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 15px; outline: none;
      transition: border-color 0.15s;
    }
    #markerNameInput:focus { border-color: #1a73e8; }
    .modal-btns { display: flex; gap: 10px; margin-top: 14px; }
    .modal-btns button {
      flex: 1; padding: 12px; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    #modalCancelBtn { background: #f1f3f4; color: #555; }
    #modalConfirmBtn { background: #1a73e8; color: white; }
    #modalConfirmBtn:active { background: #1558b0; }

    /* iOS 설치 안내 배너 */
    #installBanner {
      display: none; position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white; padding: 14px 16px;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.15);
      z-index: 6000; flex-direction: column; gap: 8px;
    }
    #installBanner.show { display: flex; }
    #installBanner .banner-row { display: flex; align-items: center; justify-content: space-between; }
    #installBanner .banner-text { font-size: 14px; color: #333; line-height: 1.5; }
    #installBanner .banner-close { background: none; border: none; font-size: 20px; color: #999; cursor: pointer; padding: 4px; }
    #installBanner .banner-step { font-size: 12px; color: #666; }
  </style>
</head>
<body>

<div id="map"></div>

<!-- 검색 + 주소 표시 (주소는 검색박스 바로 아래) -->
<div id="searchBox">
  <div id="searchRow">
    <input type="text" id="searchInput" placeholder="주소·장소 검색" autocomplete="off" enterkeyhint="search">
    <button id="searchClear" title="지우기">✕</button>
    <button id="searchGo" title="검색">🔍</button>
  </div>
  <div id="address-display" onclick="copyAddr()" title="탭하면 주소 복사">위치 확인 중...</div>
  <div id="searchResults"></div>
</div>

<button class="btn" id="saveBtn" title="HTM으로 저장 / 공유" disabled>💾</button>
<button class="btn" id="loadBtn" title="KMZ / HTM / 사진 불러오기">📂</button>
<button class="btn" id="myLocationBtn" title="현재 위치">
  <svg viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="4" stroke="#1a73e8" stroke-width="2"/>
    <circle cx="12" cy="12" r="8" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="12" y1="2" x2="12" y2="6" stroke="#1a73e8" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="18" x2="12" y2="22" stroke="#1a73e8" stroke-width="2" stroke-linecap="round"/>
    <line x1="2" y1="12" x2="6" y2="12" stroke="#1a73e8" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="12" x2="22" y2="12" stroke="#1a73e8" stroke-width="2" stroke-linecap="round"/>
  </svg>
</button>
<button class="btn" id="drawBtn" title="선 그리기">✏️</button>
<button class="btn" id="drawStyleBtn" title="선 색상/굵기"><span class="dsb-line"></span></button>
<button class="btn" id="markerBtn" title="마커 추가">📍</button>
<button class="btn" id="eraseBtn" title="지우개 — 눌러서 선택 삭제">
  <svg viewBox="0 0 24 24" fill="none" width="26" height="26">
    <path d="M20 20H7L3 16L13 6L21 14L20 20Z" fill="#ffcdd2" stroke="#e53935" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M13 6L21 14L17 18L9 10L13 6Z" fill="#ef9a9a" stroke="#e53935" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="4" y1="20" x2="20" y2="20" stroke="#e53935" stroke-width="2" stroke-linecap="round"/>
  </svg>
</button>
<button class="btn" id="undoBtn" title="방금 지운 것 되살리기">↩️</button>
<button class="btn" id="clearBtn" title="전체 삭제 (빗자루)">🧹</button>
<!-- 지도종류 선택 -->
<div id="mapTypeBox">
  <select id="mapTypeSelect" onchange="changeMapType(this.value)" title="지도 종류">
    <option value="HYBRID" selected>위성+지도</option>
    <option value="SKYVIEW">위성사진</option>
    <option value="ROADMAP">일반지도</option>
    <option value="TERRAIN">🏔️ 지형도</option>
    <option value="USE_DISTRICT">🗺️ 지적도</option>
  </select>
</div>
<input type="file" id="fileInput" accept=".kmz,.zip,.kml,.htm,.html,image/jpeg,image/png,.jpg,.jpeg,.png" multiple>

<script>
// ─── 주소 표시 (클릭 지점) ────────────────────────────
let addrTimer = null;
function scheduleAddrUpdate(lat, lng) {
  clearTimeout(addrTimer);
  addrTimer = setTimeout(() => {
    if (!geocoder) return;
    geocoder.coord2Address(lng, lat, (result, status) => {
      if (status !== kakao.maps.services.Status.OK || !result[0]) {
        document.getElementById('address-display').textContent = '';
        return;
      }
      const addr = result[0].address;
      const parts = (addr?.address_name || '').split(' ').filter(p => !/^\d/.test(p));
      const eupMyeon = parts.find(p => /[읍면]$/.test(p)) || '';
      const ri = parts.find(p => /리$/.test(p)) || '';
      const gu = parts.find(p => /구$/.test(p)) || '';
      const dong = [...parts].reverse().find(p => /동(\d+가)?$/.test(p)) || '';
      let text = '';
      if (eupMyeon && ri) text = `${eupMyeon} ${ri}`;
      else if (eupMyeon) text = eupMyeon;
      else if (gu && dong) text = `${gu} ${dong}`;
      else if (dong) text = dong;
      else text = addr?.address_name || '';
      // 번지(지번) 추가
      const mainNo = addr?.main_address_no || '';
      const subNo  = addr?.sub_address_no  || '';
      if (mainNo) text += ' ' + (subNo && subNo !== '0' ? `${mainNo}-${subNo}` : mainNo);
      document.getElementById('address-display').textContent = text;
    });
  }, 600);
}

function copyAddr() {
  const el = document.getElementById('address-display');
  const val = el.textContent;
  if (!val || val === '위치 확인 중...') return;
  navigator.clipboard.writeText(val).catch(() => {});
  const prev = el.textContent;
  el.textContent = '✅ 복사됨';
  setTimeout(() => el.textContent = prev, 1300);
}

// ─── 검색 (카카오 주소/장소) ──────────────────────────
function showSearchMsg(msg) {
  const box = document.getElementById('searchResults');
  box.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'sr-msg';
  d.textContent = msg;
  box.appendChild(d);
  box.classList.add('show');
}
function hideSearchResults() {
  document.getElementById('searchResults').classList.remove('show');
}

// 주소 검색 (지번/도로명)
function searchAddress(q) {
  return new Promise(resolve => {
    if (!geocoder) { resolve([]); return; }
    geocoder.addressSearch(q, (result, status) => {
      if (status !== kakao.maps.services.Status.OK || !result) { resolve([]); return; }
      resolve(result.map(r => ({
        title: r.address?.address_name || r.address_name || '',
        addr : r.road_address?.address_name || '',
        region: (r.address_name || '') + ' ' + (r.road_address?.address_name || ''),
        lng  : parseFloat(r.x),
        lat  : parseFloat(r.y)
      })));
    });
  });
}

// 장소(키워드) 검색
let placesSvc = null;
function searchPlace(q) {
  return new Promise(resolve => {
    try {
      if (!placesSvc) placesSvc = new kakao.maps.services.Places();
    } catch (_) { resolve([]); return; }
    placesSvc.keywordSearch(q, (data, status) => {
      if (status !== kakao.maps.services.Status.OK || !data) { resolve([]); return; }
      resolve(data.map(p => ({
        title: p.place_name || '',
        addr : p.address_name || p.road_address_name || '',
        region: (p.address_name || '') + ' ' + (p.road_address_name || ''),
        lng  : parseFloat(p.x),
        lat  : parseFloat(p.y)
      })));
    }, { size: 10 });
  });
}

// 같은 이름이 여러 곳이면 장수군 → 전북 → 나머지 순 (캐드 juso.lsp 의 JUSO:TIERS 와 같은 규칙)
//   names : 주소에 들어 있으면 그 지역으로 보는 이름 / prefix : 검색어 앞에 붙여 한 번 더 찾을 지역명
// 전국 검색만 하면 카카오가 다른 지역 결과만 돌려주는 경우가 있어서, 지역명을 붙인 검색을 같이 한다.
const SEARCH_TIERS = [
  { names: ['장수군'],          prefix: '전북특별자치도 장수군' },   // 1순위
  { names: ['전북', '전라북도'], prefix: '전북특별자치도' }          // 2순위
];                                                                  // 3순위: 나머지 (검색 순서 유지)
function searchQueries(q) {
  return SEARCH_TIERS.filter(t => !t.names.some(n => q.includes(n))).map(t => t.prefix + ' ' + q).concat([q]);
}
function searchTier(r) {
  const txt = r.region || ((r.title || '') + ' ' + (r.addr || ''));
  const i = SEARCH_TIERS.findIndex(t => t.names.some(n => txt.includes(n)));
  return i < 0 ? SEARCH_TIERS.length : i;
}

let searchSeq = 0;
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { hideSearchResults(); clearSearchMarker(); return; }   // 빈칸으로 검색 = 검색 핀 지우기
  const seq = ++searchSeq;
  showSearchMsg('검색 중...');
  const settled = await Promise.allSettled(searchQueries(q).flatMap(qq => [searchAddress(qq), searchPlace(qq)]));
  if (seq !== searchSeq) return;   // 더 최근 검색이 있으면 무시
  const seen = new Set(), list = [];
  settled.forEach(s => {
    if (s.status !== 'fulfilled') return;
    s.value.forEach(r => {
      if (!r.title || !isFinite(r.lng) || !isFinite(r.lat)) return;
      const k = r.lat.toFixed(6) + ',' + r.lng.toFixed(6);
      if (seen.has(k)) return;
      seen.add(k);
      list.push(r);
    });
  });
  // 장수군 → 전북 → 나머지 (같은 순위 안에서는 검색 순서 유지 — Array.sort 는 안정 정렬)
  list.sort((a, b) => searchTier(a) - searchTier(b));
  renderSearchResults(list.slice(0, 20));
}

function renderSearchResults(list) {
  if (!list.length) { showSearchMsg('검색 결과가 없습니다'); return; }
  const box = document.getElementById('searchResults');
  box.innerHTML = '';
  list.forEach(r => {
    const item = document.createElement('div');
    item.className = 'sr-item';
    const t = document.createElement('div');
    t.className = 'sr-t';
    t.textContent = r.title;
    item.appendChild(t);
    if (r.addr) {
      const a = document.createElement('div');
      a.className = 'sr-a';
      a.textContent = r.addr;
      item.appendChild(a);
    }
    item.addEventListener('click', () => moveToSearchResult(r));
    box.appendChild(item);
  });
  box.classList.add('show');
}

// 검색한 자리 핀 — map.html 과 같은 카카오 기본 마커. 자동저장·내보내기 대상(markers) 아님
let searchMarker = null, _lastSearchQ = '';
function clearSearchMarker() {
  if (searchMarker) { searchMarker.setMap(null); searchMarker = null; }
  _lastSearchQ = '';
}
function moveToSearchResult(r) {
  hideSearchResults();
  document.getElementById('searchInput').blur();
  if (!map) return;
  const pos = new kakao.maps.LatLng(r.lat, r.lng);
  if (searchMarker) searchMarker.setMap(null);
  searchMarker = new kakao.maps.Marker({ map, position: pos, zIndex: 5 });
  searchMarker.setClickable(false);   // 지도 탭(마커 찍기·선 그리기)을 가로채지 않게
  _lastSearchQ = document.getElementById('searchInput').value.trim();
  map.setCenter(pos);
  if (map.getLevel() > 3) map.setLevel(3);
  scheduleAddrUpdate(r.lat, r.lng);
}

(function initSearchUI() {
  const input = document.getElementById('searchInput');
  const clear = document.getElementById('searchClear');
  if (!input) return;
  const syncClear = () => clear.classList.toggle('show', !!input.value);
  input.addEventListener('input', syncClear);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); doSearch(); }
    else if (e.key === 'Escape') { hideSearchResults(); input.blur(); }
  });
  // 검색한 자리에 핀이 있는 채로 같은 검색어(또는 빈칸)로 검색 버튼을 다시 누르면 → 핀·검색어 지우기
  document.getElementById('searchGo').addEventListener('click', () => {
    input.blur();
    const q = input.value.trim();
    if (searchMarker && (!q || q === _lastSearchQ)) {
      clearSearchMarker();
      input.value = ''; syncClear(); hideSearchResults();
      return;
    }
    doSearch();
  });
  clear.addEventListener('click', () => {
    input.value = '';
    syncClear();
    hideSearchResults();
    input.focus();
  });
  // 검색창 밖을 누르면 결과 닫기
  document.addEventListener('pointerdown', e => {
    if (!document.getElementById('searchBox').contains(e.target)) hideSearchResults();
  }, true);
})();

// ─── 마커 추가 모달 ───────────────────────────────────
let pendingMarkerLatLng = null;

function openMarkerModal(latLng) {
  pendingMarkerLatLng = latLng;
  const input = document.getElementById('markerNameInput');
  input.value = '';
  document.getElementById('markerModal').classList.add('show');
  setTimeout(() => input.focus(), 100);
}

function closeMarkerModal() {
  document.getElementById('markerModal').classList.remove('show');
  pendingMarkerLatLng = null;
}

document.getElementById('markerModal').addEventListener('click', e => {
  if (e.target === document.getElementById('markerModal')) closeMarkerModal();
});
document.getElementById('modalCancelBtn').onclick = closeMarkerModal;
document.getElementById('modalConfirmBtn').onclick = () => {
  const name = document.getElementById('markerNameInput').value.trim();
  if (!name) { document.getElementById('markerNameInput').focus(); return; }
  if (pendingMarkerLatLng) {
    addMarker(pendingMarkerLatLng, name);
// [추가]
    document.getElementById('saveBtn').disabled = false;
    autoSaveToDB();
  }
  closeMarkerModal();
};
document.getElementById('markerNameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('modalConfirmBtn').click();
  if (e.key === 'Escape') closeMarkerModal();
});

// ─── 마커 수정/삭제 모달 ──────────────────────────────
let editTarget = null; // { marker, iw, name, ... }

function openMarkerEditModal(markerObj) {
  editTarget = markerObj;
  document.getElementById('markerEditNameInput').value = markerObj.name || '';
  document.getElementById('markerEditModal').classList.add('show');
  setTimeout(() => document.getElementById('markerEditNameInput').focus(), 100);
}
function closeMarkerEditModal() {
  document.getElementById('markerEditModal').classList.remove('show');
  editTarget = null;
}
document.getElementById('markerEditModal').addEventListener('click', e => {
  if (e.target === document.getElementById('markerEditModal')) closeMarkerEditModal();
});
document.getElementById('editCancelBtn').onclick = closeMarkerEditModal;
document.getElementById('editSaveBtn').onclick = () => {
  if (!editTarget) return;
  const newName = document.getElementById('markerEditNameInput').value.trim();
  if (!newName) { document.getElementById('markerEditNameInput').focus(); return; }
  // 이름 업데이트
  const entry = markers.find(m => m.marker === editTarget.marker);
  if (entry) entry.name = newName;
  // InfoWindow 내 이름 텍스트 갱신
  const nameSpan = editTarget.iw.getContent().querySelector('span');
  if (nameSpan) nameSpan.textContent = newName;
  editTarget.iw.close();
  closeMarkerEditModal();
  autoSaveToDB();
};
document.getElementById('editDeleteBtn').onclick = () => {
  if (!editTarget) return;
  const t = editTarget;
  t.iw.close();
  t.marker.setMap(null);
  if (t.origKey) delOrig(t.origKey);   // 보관 원본도 정리
  markers = markers.filter(m => m.marker !== t.marker);
  if (window.gdPhotoDeleted) window.gdPhotoDeleted([t]);   // 아직 안 올라간 사진이면 드라이브 업로드도 취소할지
  if (markers.length === 0 && polylines.length === 0) document.getElementById('saveBtn').disabled = true;
  closeMarkerEditModal();
  autoSaveToDB();
};
document.getElementById('markerEditNameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('editSaveBtn').click();
  if (e.key === 'Escape') closeMarkerEditModal();
});

// ─── 마커 이동 모드 ───────────────────────────────────
let moveTarget = null;
let moveOriginalPos = null;

function onMapCenterChanged() {
  if (moveTarget) moveTarget.marker.setPosition(map.getCenter());
}

document.getElementById('editMoveBtn').onclick = () => {
  if (!editTarget) return;
  moveTarget = editTarget;
  moveOriginalPos = moveTarget.marker.getPosition();
  moveTarget.iw.close();
  closeMarkerEditModal();
  // 마커를 지도 중심으로 이동 후 추적
  moveTarget.marker.setPosition(map.getCenter());
  kakao.maps.event.addListener(map, 'center_changed', onMapCenterChanged);
  document.getElementById('moveHint').classList.add('show');
};

document.getElementById('moveOkBtn').onclick = () => {
  kakao.maps.event.removeListener(map, 'center_changed', onMapCenterChanged);
  moveTarget = null; moveOriginalPos = null;
  document.getElementById('moveHint').classList.remove('show');
  autoSaveToDB();
};

document.getElementById('moveCancelBtn').onclick = () => {
  if (moveTarget && moveOriginalPos) moveTarget.marker.setPosition(moveOriginalPos);
  kakao.maps.event.removeListener(map, 'center_changed', onMapCenterChanged);
  moveTarget = null; moveOriginalPos = null;
  document.getElementById('moveHint').classList.remove('show');
};

// ─── 마커 추가 버튼 (조준원 모드) ────────────────────
let markerPlacingMode = false;

document.getElementById('markerBtn').onclick = () => {
  if (eraseMode) setEraseMode(false);   // 지우개와 동시 사용 금지
  if (markerPlacingMode) {
    // 2차 클릭: 지도 중심 좌표로 마커 이름 입력 모달 열기
    markerPlacingMode = false;
    document.getElementById('markerBtn').classList.remove('active');
    document.getElementById('crosshair').classList.remove('show');
    const center = map.getCenter();
    openMarkerModal(center);
  } else {
    // 1차 클릭: 조준원 표시
    markerPlacingMode = true;
    document.getElementById('markerBtn').classList.add('active');
    document.getElementById('crosshair').classList.add('show');
  }
};

// PC 키보드 이벤트
document.addEventListener('keydown', e => {
  if (drawingMode && drawUndo.length > 0) {
    if (e.key === 'Backspace' || e.key === 'Escape') {
      e.preventDefault();
      undoLastAction();
    }
  }
});

// 뒤로가기 = 절대 앱 종료 안 함. 선그리기 중: 점/펜획 되돌리기 또는 모드 종료
//
// ── 기기별 실측으로 확인된 두 가지 함정 (둘 다 피해야 함) ──
// (1) popstate 안에서 pushState 로 재보충하면 안 됨: S22 등은 이를
//     "뒤로가기 가두기(back-trap)"로 판단해 두 번째 뒤로가기에서 앱을 통째로 종료시킴.
// (2) popstate 안에서 history.forward() 로 복귀해도 안 됨(20260712 이전 버전 방식):
//     갤럭시 액티브탭 등은 forward() 가 조용히 무시되어 버퍼가 소진되고 앱이 종료됨.
//
// 해결: 히스토리 항목을 미리 '깊게'(HIST_MAX개) 쌓아 두고, 보충은 popstate 가 아니라
// 사용자 터치(pointerup) 시점에만 한다 → 뒤로가기는 버퍼만 소비하며 항상 페이지 안에서
// popstate(되돌리기)로 이어지고, 화면을 만질 때마다 버퍼가 다시 가득 찬다.
const HIST_MAX = 24;   // 연속 뒤로가기(되돌리기) 최대 횟수 버퍼
let _histDepth = (history.state && history.state.k) || 0;
function _histTopUp() {
  try { while (_histDepth < HIST_MAX) history.pushState({ k: ++_histDepth }, '', ''); } catch (_) {}
}
document.addEventListener('pointerup', (e) => {
  if (e.isPrimary) _histTopUp();
}, { capture: true, passive: true });

window.removeEventListener('popstate', _earlyBackHandler);
window.addEventListener('popstate', function(ev) {
  _histDepth = (ev.state && ev.state.k) || 0;   // 남은 버퍼 깊이 동기화
  // 주의: 여기서 pushState/forward() 금지 — 위 (1)(2) 함정 참조
  if (_exitArmed) return;                             // 종료 대기로 맨 앞 항목에 온 것 — 다음 뒤로가기는 브라우저가 처리(앱 종료)
  const _pv = document.getElementById('photoViewer'); // 사진 크게 보기 → 지도로 (드라이브 창 위에 떠 있을 수도 있어 맨 먼저)
  if (_pv && _pv.classList.contains('show')) { _pv.classList.remove('show'); return; }
  if (window.gdOnBack && window.gdOnBack()) return;   // 구글 드라이브 창·불러오기가 떠 있으면 그것만 닫는다
  if (_closeTopPopup()) return;                       // 사진 보기·입력창·메뉴가 떠 있으면 그것만 닫는다
  if (drawingMode) {
    if (drawUndo.length > 0) undoLastAction();
    else stopDrawing();
    return;
  }
  _armExit();
});

// 뒤로가기로 닫을 화면들 (위에 뜬 것부터)
function _closeTopPopup() {
  const dyn = Array.from(document.querySelectorAll('body > div:not([id])')).filter(el => {
    const cs = getComputedStyle(el);   // 즉석으로 만든 전체 화면 창(id 없음, 화면 전체 덮음)
    return cs.position === 'fixed' && cs.display !== 'none' && el.offsetWidth >= innerWidth - 2 && el.offsetHeight >= innerHeight - 2;
  });
  if (dyn.length) { dyn[dyn.length - 1].remove(); return true; }   // 위치 공유 등 즉석 확인창
  const closers = [
    ['markerEditModal', () => closeMarkerEditModal()],
    ['markerModal',     () => closeMarkerModal()],
    ['stylePicker',     () => closeStylePicker()],
    ['polyMenu',        () => hidePolyMenu()],
    ['searchResults',   () => hideSearchResults()],
  ];
  for (const [id, fn] of closers) {
    const el = document.getElementById(id);
    if (el && el.classList.contains('show')) { try { fn(); } catch (e) { el.classList.remove('show'); } return true; }

    markerPlacingMode = false;
    document.getElementById('markerBtn').classList.remove('active');
    document.getElementById('crosshair').classList.remove('show');
    return true;
  }
  if (typeof markers !== 'undefined') {                // 열린 말풍선
    let closed = false;
    markers.forEach(m => { try { if (m.iw && m.iw.getMap && m.iw.getMap()) { m.iw.close(); closed = true; } } catch (e) {} });
    if (closed) return true;
  }

}

// 되돌리기: 마지막 동작(탭 점 1개 또는 펜 획 1개)을 취소
function undoLastAction() {
  const act = drawUndo.pop();
  if (!act) return;
  if (act.type === 'stroke') {
    // 펜으로 그린 획 하나를 통째로 제거
    if (act.entry && act.entry.poly) {
      act.entry.poly.setMap(null);
      polylines = polylines.filter(p => p.poly !== act.entry.poly);
    }
    if (moveLine) { moveLine.setMap(null); moveLine = null; }
    if (distanceOverlay) { distanceOverlay.setMap(null); distanceOverlay = null; }
    if (markers.length === 0 && polylines.length === 0) document.getElementById('saveBtn').disabled = true;
    autoSaveToDB();
    return;
  }
  // act.type === 'point' : 탭으로 찍은 점 하나 제거
  if (currentPath.length === 0) return;
  currentPath.pop();
  currentPolyline.setPath(currentPath);
  if (moveLine) { moveLine.setMap(null); moveLine = null; }
  if (currentPath.length > 0) {
    const last = currentPath[currentPath.length - 1];
    const fmt = d => d < 1000 ? Math.round(d) + 'm' : (d/1000).toFixed(2) + 'km';
    const total = currentPolyline.getLength();
    const html = '<div class="distance-overlay">📍 총 ' + fmt(total) + '</div>';
    if (distanceOverlay) {
      distanceOverlay.setPosition(last);
      distanceOverlay.setContent(html);
    } else {
      distanceOverlay = new kakao.maps.CustomOverlay({
        map, content: html, position: last, xAnchor: 0, yAnchor: 1.8, zIndex: 3
      });
    }
  } else {
    if (distanceOverlay) { distanceOverlay.setMap(null); distanceOverlay = null; }
  }
}
// 이전 이름 호환
function undoLastPoint() { undoLastAction(); }
// ─── IndexedDB: KMZ 파일 저장/복원 + 사진 원본 보관 ──
// 'orig' 스토어: 불러온/촬영한 사진의 원본(dataURL, 전체 EXIF 포함)을 보관.
// 지도 표시·KMZ 는 압축본을 쓰지만, 메타 수정·사진저장은 항상 원본 기준 → EXIF 유실 방지.
const DB_NAME = 'kmz-viewer', DB_VER = 2, STORE = 'kmz', ORIG_STORE = 'orig';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      if (!db.objectStoreNames.contains(ORIG_STORE)) db.createObjectStore(ORIG_STORE);
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveOrig(key, dataUrl) {
  try { const db = await openDB(); db.transaction(ORIG_STORE, 'readwrite').objectStore(ORIG_STORE).put(dataUrl, key); } catch(e) {}
}
async function getOrig(key) {
  if (!key) return null;
  try {
    const db = await openDB();
    return await new Promise(res => {
      const r = db.transaction(ORIG_STORE).objectStore(ORIG_STORE).get(key);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    });
  } catch(e) { return null; }
}
async function delOrig(key) {
  if (!key) return;
  try { const db = await openDB(); db.transaction(ORIG_STORE, 'readwrite').objectStore(ORIG_STORE).delete(key); } catch(e) {}
}
async function clearOrigs() {
  try { const db = await openDB(); db.transaction(ORIG_STORE, 'readwrite').objectStore(ORIG_STORE).clear(); } catch(e) {}
}

async function saveKMZtoDB(fileOrBlob, fileName = 'last_state.kmz') {
  try {
    const db = await openDB();
    const buf = await fileOrBlob.arrayBuffer();
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put({ buf, name: fileName }, 'last');
    console.log('데이터가 DB에 저장되었습니다.');
  } catch (e) { console.warn('DB 저장 실패', e); }
}

async function loadKMZfromDB() {
  try {
    const db = await openDB();
    return new Promise(resolve => {
      const req = db.transaction(STORE).objectStore(STORE).get('last');
      req.onsuccess = () => {
        if (req.result) {
          resolve(new File([req.result.buf], req.result.name, { type: 'application/vnd.google-earth.kmz' }));
        } else resolve(null);
      };
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}

// CSS scale 확대 시 클릭 좌표 보정 → 위경도 변환
// transformOrigin이 중심(50% 50%)이므로 화면 중심 기준 오프셋을 cssScale로 나눠 역산
function getScaledLatLng(clientX, clientY) {
  const mapEl = document.getElementById('map');
  const mapW = mapEl.offsetWidth;
  const mapH = mapEl.offsetHeight;
  const screenCenterX = mapW / 2;
  const screenCenterY = mapH / 2;
  // scale 전 실제 지도 내 픽셀 좌표로 역산
  const px = screenCenterX + (clientX - screenCenterX) / cssScale;
  const py = screenCenterY + (clientY - screenCenterY) / cssScale;
  const proj = map.getProjection();
  const centerPx = proj.pointFromCoords(map.getCenter());
  return proj.coordsFromPoint(new kakao.maps.Point(
    centerPx.x - mapW / 2 + px,
    centerPx.y - mapH / 2 + py
  ));
}

      penDownX = e.clientX; penDownY = e.clientY;
      cancelMapPress();               // 롱프레스 타이머 취소
      map.setDraggable(false);        // 펜 그리는 동안 지도 이동 잠금
      suppressMapClick = true;        // pointerup 뒤 따라오는 map click 무시
      try { mapDiv.setPointerCapture(e.pointerId); } catch (_) {}
      // 이번 획 전용으로 새 폴리라인 생성 → 이전 획과 이어지지 않음
      penPath = [];
      penPoly = new kakao.maps.Polyline({
        map, path: penPath,
        strokeWeight: currentDrawWidth, strokeColor: currentDrawColor, strokeOpacity: 1
      });
      attachPolylineDelete(penPoly);
      penEntry = { poly: penPoly, name: '선', path: penPath, color: currentDrawColor, width: currentDrawWidth };
      polylines.push(penEntry);
      penAddPoint(e.clientX, e.clientY);
      penLastPt = { x: e.clientX, y: e.clientY };
      e.preventDefault();
    }, { capture: true, passive: false });

    mapDiv.addEventListener('pointermove', (e) => {
      if (!penDrawing || e.pointerId !== penActiveId) return;
      if (penLastPt &&
          Math.abs(e.clientX - penLastPt.x) < PEN_MIN_PX &&
          Math.abs(e.clientY - penLastPt.y) < PEN_MIN_PX) return;
      penAddPoint(e.clientX, e.clientY);
      penLastPt = { x: e.clientX, y: e.clientY };
      e.preventDefault();
    }, { capture: true, passive: false });

    function endPen(e) {
      if (!penDrawing) return;
      if (e && penActiveId !== null && e.pointerId !== penActiveId) return;
      // 일부 기기는 획 도중 pointermove 가 유실됨 → 누른 지점~뗀 지점 거리로 획 여부 보정
      // (보정 없으면 획이 '탭'으로 오인되어 이전 선에 이어지던 원인)
      if (e && e.type === 'pointerup' && penPath && penPath.length < 2 &&
          Math.hypot(e.clientX - penDownX, e.clientY - penDownY) >= PEN_TAP_PX) {
        penAddPoint(e.clientX, e.clientY);
      }
      penDrawing = false; penActiveId = null; penLastPt = null;
      map.setDraggable(true);
      if (penPath && penPath.length > 1) {
        // 끌어서 그린 자유곡선 획 → 각기 다른 선으로 확정
        penEntry.path = [...penPath];
        drawUndo.push({ type: 'stroke', entry: penEntry });   // 되돌리기용
        document.getElementById('saveBtn').disabled = false;
        autoSaveToDB();
      } else if (penPoly) {
        // 끌지 않고 톡 찍음 = 점 하나 → 획은 버리고, 탭 선에 점으로 추가(점찍기 겸용)
        const pt = penPath && penPath.length ? penPath[0] : null;
        penPoly.setMap(null);
        polylines = polylines.filter(p => p.poly !== penPoly);
        if (pt && currentPolyline) {
          currentPath.push(pt);
          currentPolyline.setPath(currentPath);
          drawUndo.push({ type: 'point' });
          updateDistanceOverlay(pt);
          document.getElementById('saveBtn').disabled = false;
          autoSaveToDB();
        }
      }
      penPoly = null; penPath = null; penEntry = null;
      // 펜 뗀 직후 오는 합성 click 만 무시하고, 없으면 다음 탭이 막히지 않게 해제
      suppressMapClick = true;
      setTimeout(() => { suppressMapClick = false; }, 350);
    }
    mapDiv.addEventListener('pointerup', endPen, { capture: true });
    mapDiv.addEventListener('pointercancel', endPen, { capture: true });
  }

  kakao.maps.event.addListener(map, 'touchend', () => clearTimeout(mapLongPressTimer));
  kakao.maps.event.addListener(map, 'touchmove', (e) => {
    const t = e.changedTouches ? e.changedTouches[0] : e;
    if (Math.abs(t.clientX - startX) > 8 || Math.abs(t.clientY - startY) > 8) {
      clearTimeout(mapLongPressTimer);
      if (drawingMode && currentPath.length > 0) {
        const latLng = cssScale > 1 ? getScaledLatLng(t.clientX, t.clientY) : e.latLng;
        updateDistanceOverlay(latLng, true);
      }
    }
  });

  // PC 마우스 (롱프레스 마커추가 제거)
  kakao.maps.event.addListener(map, 'mouseup', () => clearTimeout(mapLongPressTimer));

  // ─── 레벨 1 이후 CSS scale 확대 ──────────────────────
  const mapEl = document.getElementById('map');
  const MAX_CSS_SCALE = 8;

  function applyScale(newScale) {
    cssScale = Math.max(1, Math.min(MAX_CSS_SCALE, newScale));
    mapEl.style.transformOrigin = '50% 50%';
    mapEl.style.transform = cssScale === 1 ? '' : `scale(${cssScale})`;
  }

  // 핀치/휠로 인한 CSS scale 확대는 중심점이 흔들려 조작이 어려우므로 제거.
  // 최대 확대(레벨0) 이후 추가 확대/축소는 우측 하단 +,- 버튼으로만 가능.

  // 실제 줌 레벨이 바뀌면 CSS scale 은 1로 리셋.
  // (CSS scale 은 '더 이상 레벨이 안 내려갈 때'만 +버튼으로 걸리므로, 레벨이 바뀌었다는 건
  //  최대 확대에서 벗어났다는 뜻. 최대 레벨이 0이든 1이든 상관없이 맞게 동작한다.)
  kakao.maps.event.addListener(map, 'zoom_changed', () => applyScale(1));

  // 묶음선(KMZ MultiGeometry) 뷰포트 컬링 — 이동/줌 멈출 때마다 화면 교차 구간만 다시 그림
  kakao.maps.event.addListener(map, 'idle', scheduleBundleCull);
  kakao.maps.event.addListener(map, 'zoom_changed', updateTextLabelSizes); // CAD 문자 라벨 줌 연동 크기

  // CSS scale +/- 버튼
  document.getElementById('cssZoomIn').onclick = () => {
    if (cssScale > 1) { applyScale(cssScale * 2); return; }   // 이미 CSS 확대 중이면 계속 CSS 로
    const lv = map.getLevel();
    map.setLevel(lv - 1);                                     // 카카오맵 확대 시도
    // 레벨이 실제로 안 내려가면(기기/지역에 따라 레벨 0 미지원) CSS scale 로 확대.
    // 레벨 하한을 숫자로 박아두면 그 하한이 틀린 기기에서 버튼이 통째로 먹통이 된다.
    setTimeout(() => { if (map.getLevel() === lv) applyScale(cssScale * 2); }, 60);
  };
  document.getElementById('cssZoomOut').onclick = () => {
    if (cssScale > 1) {
      applyScale(cssScale / 2); // CSS scale 축소
    } else {
      map.setLevel(map.getLevel() + 1); // 카카오맵 축소
    }
  };

  // ── 줌 디버그 배지 (주소에 ?zoomdebug=1 붙였을 때만) ────────────────────────
  // 휴대폰에서 카카오가 레벨 0 을 실제로 허용하는지 눈으로 확인하기 위한 임시 표시.
  if (/[?&]zoomdebug=1/.test(location.search)) {
    const badge = document.createElement('div');
    badge.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99999;background:rgba(0,0,0,.75);'
      + 'color:#fff;font:12px/1.4 monospace;padding:4px 7px;border-radius:5px;pointer-events:none';
    document.body.appendChild(badge);
    const upd = () => { badge.textContent = 'level ' + map.getLevel() + ' / scale ' + cssScale; };
    kakao.maps.event.addListener(map, 'zoom_changed', upd);
    setInterval(upd, 300);
    upd();
  }
}

// ─── Web Share Target: '공유 → KMZ 뷰어'로 받은 파일 소비 ─────
// sw.js 가 공유 POST 를 받아 'shared-files' 캐시에 넣고 './?shared=1' 로 리다이렉트한다.
async function consumeSharedFiles() {
  if (!/[?&]shared=1/.test(location.search)) return;
  history.replaceState(history.state, '', location.pathname);   // URL 정리 (새로고침 시 재소비 방지)
  try {
    const cache = await caches.open('shared-files');
    const mRes = await cache.match('./shared-manifest');
    if (!mRes) return;
    const names = await mRes.json();
    for (let i = 0; i < names.length; i++) {
      const r = await cache.match('./shared-file-' + i);
      if (!r) continue;
      const blob = await r.blob();
      const file = new File([blob], names[i]);
      if (/\.(jpe?g|png)$/i.test(names[i])) await loadImageAsMarker(file);
      else if (/\.html?$/i.test(names[i])) { await loadHTM(file); autoSaveToDB(); }
      else { await loadKMZ(file); autoSaveToDB(); }   // kmz/kml/zip (확장자 불명이어도 PK 헤더로 판별)
    }
    await caches.delete('shared-files');
  } catch (e) { console.warn('공유 파일 처리 실패', e); }
}

// ─── PC 지도가 보낸 데이터 받기 (해시 #link) ─────────────────
// PC 지도(map.html)의 'HTM 내보내기 (깃허브지도)' 로 만든 파일을 열면, 그 파일이
// 이 페이지를 새 탭으로 띄우고 postMessage 로 { LINES, POLYS, TEXTS, MARKERS, PHOTOS } 를 넘긴다.
// file:// 로 연 페이지는 보안 컨텍스트가 아니라 내위치(geolocation)가 항상 막히므로,
// 데이터만 로컬 파일에 두고 지도 화면은 https 인 여기서 띄우는 구조다.
// cross-origin 통로 중 URL 해시는 사진(base64 수 MB)을 못 담고 window.name 은
// Chrome 88부터 초기화되므로 postMessage 만 쓸 수 있다.
//
// #link 로 열렸을 때만, 딱 한 번만 받는다. 보내는 쪽이 file:// 이면 ev.origin 이 'null' 이라
// 발신 origin 으로는 거를 수 없어서 이 두 조건으로 대신 제한한다.
// ─── 지도 탭 하나로 모으기 ────────────────────────────
// 런처 htm 을 여러 번 열면 그때마다 새 지도 탭이 열린다. 창 이름('jtymap')은 탭 그룹을
// 넘어 공유되지 않아서 런처 쪽에서 기존 탭을 찾아 재사용할 방법이 없다.
// 그래서 반대로, '런처로 새로 열린 탭'이 데이터를 다 받은 뒤 같은 주소의 다른 탭들에게
// 비켜달라고 방송한다. 이전 탭의 내용은 IndexedDB 자동저장에서 이미 복원돼 있고 파일
// 내용도 방금 반영했으므로, 남는 탭 하나에 전부 들어 있다.
// (직접 주소로 연 탭은 브라우저가 close() 를 거부할 수 있다 — 그때는 그냥 남는다)
let _tabBC = null, _tabClaimed = false;
function _initTabChannel() {
  if (!('BroadcastChannel' in window)) return;
  try { _tabBC = new BroadcastChannel('jtymap-tabs:' + location.pathname); } catch (e) { return; }
  _tabBC.onmessage = ev => {
    if (!ev.data || ev.data.t !== 'takeover' || _tabClaimed) return;
    const p = ev.data.payload;
    try { window.close(); } catch (e) {}
    // 브라우저는 '스크립트가 연 탭'만 닫아준다. 직접 주소로 연 탭은 닫기가 거부돼 그대로
    // 남는데, 런처 창이 사라지면 브라우저가 그 탭으로 돌아가 '빈 지도'를 보여주는 일이
    // 생긴다. 그래서 닫히지 않았으면 같은 데이터를 이 탭에도 그린다(중복은 걸러짐).
    setTimeout(() => {
      if (!p) return;
      _tabClaimed = true;
      Promise.resolve(_loadHtmData(p)).then(() => autoSaveToDB()).catch(() => {});
    }, 400);
  };
}
function _claimSingleTab(payload) {
  _tabClaimed = true;   // 동시에 두 탭이 방송해도 서로 닫아버리지 않게
  if (_tabBC) { try { _tabBC.postMessage({ t: 'takeover', payload: payload || null }); } catch (e) {} }
}

function _installLinkReceiver() {
  if (!/(^|[#&])link(&|=|$)/.test(location.hash || '')) return;
  let loaded = false;
  const reply = (ev, msg) => { try { ev.source && ev.source.postMessage(msg, '*'); } catch (e) {} };
  const onMsg = async ev => {
    const d = ev.data;
    if (!d || typeof d !== 'object') return;
    if (d.__jtymap === 'ping') { if (!loaded) reply(ev, { __jtymap: 'ready' }); return; }
    if (d.__jtymap !== 'data' || loaded) return;
    loaded = true;
    window.removeEventListener('message', onMsg);
    try {
      // 복원이 끝난 뒤에 그린다 — silent 복원의 초기화가 받은 데이터를 지우지 않게
      try { await (window._restoreReady || Promise.resolve()); } catch (e) {}
      await _loadHtmData(d.payload || {});
      autoSaveToDB();                     // 앱을 다시 열어도 남아 있게 (공유파일 처리와 같은 방식)
      _claimSingleTab(d.payload || {});   // 먼저 열려 있던 지도 탭들은 닫는다(못 닫으면 같은 데이터 전달)
      reply(ev, { __jtymap: 'done' });
    } catch (e) {
      hideLoading();
      alert('전달받은 데이터를 읽지 못했습니다: ' + e.message);
    }
    // 새로고침 시 다시 대기 상태로 남지 않게 해시만 지운다.
    // history.state 는 그대로 둔다 — 뒤로가기 버퍼(_histTopUp)가 여기에 들어있다.
    try { history.replaceState(history.state, '', location.pathname + location.search); } catch (e) {}
  };
  window.addEventListener('message', onMsg);
  // 런처가 ping 을 보내기 전에 먼저 알려 첫 전달을 앞당긴다
  try { if (window.opener) window.opener.postMessage({ __jtymap: 'ready' }, '*'); } catch (e) {}

  // ── 런처와 연결이 끊긴 경우 이유를 알려준다 ──────────
  // 안드로이드에서 이 주소(/img/)에 앱(KMZ 뷰어)이 설치돼 있으면, 런처의 window.open 을
  // 브라우저 탭이 아니라 '설치된 앱'이 가로채 여는 일이 있다. 그러면 opener 가 끊겨
  // 런처가 데이터를 넘길 수 없고 — 지도는 뜨는데 객체가 하나도 없는 상태가 된다.
  // 원인이 안 보여 헷갈리므로, 8초를 기다려도 안 오면 해결책과 함께 알려준다.
  setTimeout(() => {
    if (loaded) return;
    const orphan = !window.opener;
    showToastMsg(orphan
      ? '런처와 연결이 끊겼습니다 — 파일을 "공유 → KMZ 뷰어"로 열어 주세요'
      : '런처에서 데이터가 아직 안 왔습니다');
    if (orphan) console.warn('[jtymap] #link 로 열렸는데 opener 가 없음 — 설치된 앱이 링크를 가로챈 것으로 보임');
  }, 8000);
}

kakao.maps.load(() => {
  initMap(new kakao.maps.LatLng(35.6478, 127.5213));
  _initTabChannel();   // 다른 탭이 '비켜달라'고 하면 받을 수 있게 먼저 열어 둔다

  // 이전 데이터 복원.
  // ⚠ 수신부(_installLinkReceiver)는 복원 결과와 상관없이 '즉시' 걸어야 한다.
  //   전에는 복원이 끝난 뒤에 걸었는데(복원의 초기화가 받은 데이터를 지우니까),
  //   복원이 실패하거나 오래 걸리면 수신 대기가 아예 안 걸려서 런처가 보낸 데이터를
  //   못 받고 '지도는 뜨는데 객체가 하나도 없음' 이 됐다.
  //   → 수신은 바로 걸고, 받은 데이터는 복원이 끝난 뒤에 그린다(_restoreReady 대기).
  //   복원이 영영 안 끝나는 경우까지 대비해 15초 뒤에는 그냥 그린다.
  const _restore = loadKMZfromDB()
    .then(async file => { if (file) await loadKMZ(file, true); })
    .catch(e => console.warn('이전 데이터 복원 실패 — 빈 지도로 시작', e));
  window._restoreReady = Promise.race([_restore, new Promise(r => setTimeout(r, 15000))]);
  window._restoreReady.then(() => { _restoreDone = true; });
  // 전에 보던 화면 복원 — 복원(setBounds)이 끝난 뒤 덮어쓴다. 런처·공유 파일은 이보다 뒤에 그려져 그쪽이 이긴다.
  const _lpK = (() => { try { return JSON.parse(localStorage.getItem('lastPosK')); } catch (_) { return null; } })();
  _restore.then(() => {
    if (_lpK && isFinite(_lpK.lat) && isFinite(_lpK.lng)) {
      try { if (isFinite(_lpK.z)) map.setLevel(_lpK.z); map.setCenter(new kakao.maps.LatLng(_lpK.lat, _lpK.lng)); } catch (e) {}
    }
    let _lpTimer = null;     // 복원이 끝난 뒤부터 보던 화면 저장
    kakao.maps.event.addListener(map, 'idle', () => {
      clearTimeout(_lpTimer);
      _lpTimer = setTimeout(() => {
        try { const c = map.getCenter(); localStorage.setItem('lastPosK', JSON.stringify({ lat: c.getLat(), lng: c.getLng(), z: map.getLevel() })); } catch (e) {}
      }, 500);
    });
  });
  _startLocationOnLoad();   // 내 위치 1단계로 시작 (항상 표시 + 처음 한 번 내 위치로)
  _restore.then(() => { try { consumeSharedFiles(); } catch (e) { console.warn('공유파일 처리 실패', e); } });
  _installLinkReceiver();

  // ─── File Handling API: KMZ 파일로 앱 실행됐을 때 (데스크톱 Chrome/Edge) ─────
  if ('launchQueue' in window) {
    window.launchQueue.setConsumer(async (launchParams) => {
      if (!launchParams.files || launchParams.files.length === 0) return;
      const fileHandle = launchParams.files[0];
      const file = await fileHandle.getFile();
      if (/\.(kmz|zip|kml)$/i.test(file.name)) {
        await saveKMZtoDB(file);
        loadKMZ(file);
      } else if (/\.html?$/i.test(file.name)) {
        await loadHTM(file);
        autoSaveToDB();
      }
    });
  }
});

// ─── 선 색상/굵기 선택 (map.html 팔레트 이식) ─────────
const PALETTE_COLORS = [
  '#000000','#404040','#808080','#BFBFBF','#FFFFFF','#C00000','#FF0000','#FFC000','#FFFF00','#92D050',
  '#00B050','#00B0F0','#0070C0','#002060','#7030A0','#FF6600','#00B0A0','#E91E63','#795548','#2E86C1'
];
const LINE_WIDTHS = [2, 3, 4, 6, 8, 10];
let currentDrawColor = '#FF5733', currentDrawWidth = 4;
let _styleTarget = null;   // null=그리기 기본값(그리는 중이면 현재 선), 아니면 polylines entry

function _updateDrawStyleBtn() {
  const el = document.querySelector('#drawStyleBtn .dsb-line');
  if (el) { el.style.background = currentDrawColor; el.style.height = Math.min(10, Math.max(3, currentDrawWidth)) + 'px'; }
}

(function buildStylePicker(){
  const grid = document.getElementById('spGrid');
  PALETTE_COLORS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'sp-swatch'; b.style.background = c; b.dataset.color = c;
    b.onclick = () => applyPickedStyle(c, null);
    grid.appendChild(b);
  });
  const ws = document.getElementById('spWidths');
  LINE_WIDTHS.forEach(w => {
    const b = document.createElement('button');
    b.className = 'sp-w'; b.dataset.width = w; b.title = w + 'px';
    b.innerHTML = `<span style="height:${Math.min(w, 12)}px"></span>`;
    b.onclick = () => applyPickedStyle(null, w);
    ws.appendChild(b);
  });

// 색 또는 굵기 하나를 고르면 즉시 반영 (모달은 닫기 전까지 유지 — 색·굵기 연속 선택 가능)
function applyPickedStyle(color, width) {

// Kakao Polyline 은 색/굵기 변경 API가 없어 같은 경로로 재생성 후 참조 교체 (map.html _recreatePoly 방식)
function restylePolyline(entry, color, width) {
  const old = entry.poly;
  const parts = old._parts;
  const poly = new kakao.maps.Polyline({
    path: parts ? (parts.length === 1 ? parts[0] : parts) : old.getPath(),
    strokeWeight: width, strokeColor: color, strokeOpacity: 1
  });
  if (parts) { poly._parts = parts; poly._pnum = old._pnum; poly._viewCulled = old._viewCulled; }
  if (old.getMap()) poly.setMap(map);
  old.setMap(null);
  entry.poly = poly; entry.color = color; entry.width = width;
  attachPolylineDelete(poly, entry);
  if (parts) scheduleBundleCull();   // 묶음선은 화면 교차 구간만 다시 반영
  return poly;
}

// ─── 좌표 주변 선 찾기 (길게눌러 선택 보조) ──────────
// 카카오 Polyline 자체 히트테스트는 선을 픽셀 단위로 정확히 눌러야 반응 →
// 화면 tolPx 픽셀 반경 안에서 가장 가까운 선을 직접 찾는다.
function findNearPolyK(ll, tolPx = 15) {
  if (typeof map === 'undefined' || !map) return null;
  const b = map.getBounds(); if (!b) return null;
  const mapH = document.getElementById('map').clientHeight || 800;
  // 화면 픽셀 → 위도 간격 (CSS scale 확대 중엔 화면이 커진 만큼 반경 축소)
  const tol = (b.getNorthEast().getLat() - b.getSouthWest().getLat()) / mapH * tolPx / (cssScale || 1);
  const py = ll.getLat(), px = ll.getLng();
  const cosLat = Math.cos(py * Math.PI / 180);
  let best = null, bestD = tol;
  for (const en of polylines) {
    if (!en.poly || (!en.poly.getMap() && !en.poly._viewCulled)) continue;
    const parts = (en.parts && en.parts.length) ? en.parts : [en.path];
    for (const cs of parts) {
      if (!cs || cs.length < 2) continue;
      let ax = (cs[0].getLng() - px) * cosLat, ay = cs[0].getLat() - py;
      for (let i = 1; i < cs.length; i++) {
        // 점-선분 거리 (경도는 cos(위도) 보정 후 평면 근사)
        const bx = (cs[i].getLng() - px) * cosLat, by = cs[i].getLat() - py;
        const dx = bx - ax, dy = by - ay;
        const len2 = dx * dx + dy * dy;
        let t = len2 > 0 ? -(ax * dx + ay * dy) / len2 : 0;
        t = Math.max(0, Math.min(1, t));
        const d = Math.hypot(ax + dx * t, ay + dy * t);
        if (d < bestD) { bestD = d; best = en; }
        ax = bx; ay = by;
      }
    }
  }
  return best;
}

function attachPolylineDelete(poly, entry) {
  // 우클릭 (PC)
  kakao.maps.event.addListener(poly, 'rightclick', e => {
    suppressMapClick = true;
    showPolyMenu(e.clientX || lastClientX, e.clientY || lastClientY, poly, entry || polylines.find(p => p.poly === poly));
  });
  // 길게 누르기 (모바일)
  attachLongPress(poly, () => {
    if (drawingMode && poly === currentPolyline) return;
    showPolyMenu(lastClientX, lastClientY, poly, polylines.find(p => p.poly === poly));
  });
}
